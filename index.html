na dritta.","Alzati stendendo gambe e anche, tenendo la barra dietro.","Scendi controllando. Lavora molto i quadricipiti."],"images":["Barbell_Hack_Squat/0.jpg","Barbell_Hack_Squat/1.jpg"]},{"id":"bb_floorpress","name":"Floor press con bilanciere","equipment":"barbell","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"mechanic":"compound","level":"intermediate","category":"powerlifting","instructions":["Supino a terra, bilanciere sopra il petto, presa media.","Scendi finché i tricipiti toccano il pavimento.","Breve pausa a terra.","Spingi verso l'alto distendendo le braccia. Ottimo per i tricipiti."],"images":["Floor_Press/0.jpg","Floor_Press/1.jpg"]},{"id":"bb_pinpress","name":"Pin press","equipment":"barbell","primaryMuscles":["triceps"],"secondaryMuscles":["chest","forearms","lats","middle back","shoulders"],"mechanic":"compound","level":"intermediate","category":"powerlifting","instructions":["Bilanciere appoggiato sui pin del rack all'altezza del petto.","Parti da fermo e spingi verso l'alto fino a braccia distese.","Riporta la barra sui pin e ricomincia da fermo ogni ripetizione.","Sviluppa forza nel tratto di spinta."],"images":["Pin_Presses/0.jpg","Pin_Presses/1.jpg"]},{"id":"bb_revcurl","name":"Curl inverso con bilanciere","equipment":"barbell","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["In piedi, presa prona (palmi in giù) sul bilanciere.","Fletti i gomiti portando la barra verso le spalle.","Gomiti fermi lungo il corpo.","Scendi controllando. Lavora avambracci e bicipiti."],"images":["Reverse_Barbell_Curl/0.jpg","Reverse_Barbell_Curl/1.jpg"]},{"id":"bb_dragcurl","name":"Drag curl","equipment":"barbell","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["In piedi, presa supina sul bilanciere.","Fletti i gomiti portando la barra verso l'alto strisciando lungo il corpo.","I gomiti vanno indietro, la barra resta vicina al busto.","Scendi controllando."],"images":["Drag_Curl/0.jpg","Drag_Curl/1.jpg"]},{"id":"bb_seatedohp","name":"Lento avanti da seduto","equipment":"barbell","primaryMuscles":["shoulders"],"secondaryMuscles":["triceps"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Seduto con schienale, bilanciere all'altezza delle clavicole.","Spingi verso l'alto fino a braccia distese sopra la testa.","Non inarcare la schiena, core contratto.","Scendi controllando alle clavicole."],"images":["Seated_Barbell_Military_Press/0.jpg","Seated_Barbell_Military_Press/1.jpg"]},{"id":"bb_splitsquat","name":"Squat split con bilanciere","equipment":"barbell","primaryMuscles":["quadriceps"],"secondaryMuscles":["calves","hamstrings","lower back"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Bilanciere sui trapezi, gambe divaricate lateralmente.","Sposta il peso su una gamba piegandola, l'altra resta tesa.","Scendi mantenendo il busto eretto.","Risali e ripeti dal lato opposto."],"images":["Barbell_Side_Split_Squat/0.jpg","Barbell_Side_Split_Squat/1.jpg"]},{"id":"bb_jmpress","name":"JM press","equipment":"barbell","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Supino, presa stretta, bilanciere sopra il petto.","Scendi la barra verso il mento/gola piegando i gomiti in avanti.","È una via di mezzo tra panca stretta e french press.","Spingi distendendo i tricipiti."],"images":["JM_Press/0.jpg","JM_Press/1.jpg"]},{"id":"bb_preacher","name":"Curl alla panca Scott","equipment":"barbell","primaryMuscles":["biceps"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Braccia appoggiate sulla panca Scott, bilanciere in mano.","Fletti i gomiti portando la barra in alto.","Picco di contrazione senza staccare i gomiti dall'appoggio.","Scendi lentamente quasi a completa distensione."],"images":["Preacher_Curl/0.jpg","Preacher_Curl/1.jpg"]},{"id":"ez_curl","name":"Curl con bilanciere EZ","equipment":"e-z curl bar","primaryMuscles":["biceps"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["In piedi, presa sulle impugnature angolate del bilanciere EZ.","Fletti i gomiti portando la barra verso le spalle.","Gomiti fermi lungo il corpo, niente slancio.","Scendi controllando. La barra EZ è più gentile sui polsi."],"images":["EZ-Bar_Curl/0.jpg","EZ-Bar_Curl/1.jpg"]},{"id":"ez_spider","name":"Spider curl","equipment":"e-z curl bar","primaryMuscles":["biceps"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Petto appoggiato su una panca inclinata, braccia pendenti con la barra EZ.","Fletti i gomiti portando la barra verso l'alto.","Massima contrazione del bicipite in alto.","Scendi lentamente a braccia distese."],"images":["Spider_Curl/0.jpg","Spider_Curl/1.jpg"]},{"id":"ez_declineskull","name":"Skullcrusher declinato","equipment":"barbell","primaryMuscles":["triceps"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Supino su panca declinata, barra EZ sopra il petto a braccia tese.","Piega i gomiti scendendo la barra verso la fronte.","Gomiti fermi e puntati in alto.","Distendi contraendo i tricipiti."],"images":["Decline_EZ_Bar_Triceps_Extension/0.jpg","Decline_EZ_Bar_Triceps_Extension/1.jpg"]}]</script>
<script>
/* ============================ FORGE FIT — core ============================ */
const IMG='https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/exercises/';
const DB_URL='https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/dist/exercises.json';
const APP_VERSION='v5', APP_BUILD='17 ago 2026'; /* tienimi allineato a CACHE in sw.js */

/* ---- storage (localStorage, persiste su iPhone / GitHub Pages) ---- */
async function sget(k){try{return localStorage.getItem('ff_'+k)}catch(e){return null}}
async function sset(k,v){try{localStorage.setItem('ff_'+k,typeof v==='string'?v:JSON.stringify(v))}catch(e){console.warn('store',e)}}

let EXDB=[], BYID={};
const S={profile:null,programs:[],history:[],favorites:[],prefs:{unit:'kg'},trans:{}};
let TAB='oggi', LASTTAB=null, SESSION=null, REST=null;

async function loadAll(){
  const keys=['profile','programs','history','favorites','prefs','trans'];
  for(const k of keys){const v=await sget(k); if(v){try{S[k]=JSON.parse(v)}catch(e){}}}
}
const persist=(()=>{const t={};return k=>{clearTimeout(t[k]);t[k]=setTimeout(()=>sset(k,S[k]),250)}})();

async function loadDB(){
  // 1) embedded data (works offline / inside sandbox, no network needed)
  const node=document.getElementById('exdb-data');
  if(node){try{EXDB=JSON.parse(node.textContent)}catch(e){console.warn('embed parse',e)}}
  // 2) fallback to network only if embed missing
  if(!EXDB.length){
    const cached=await sget('exdb');
    if(cached){try{EXDB=JSON.parse(cached)}catch(e){}}
  }
  if(!EXDB.length){
    const r=await fetch(DB_URL); EXDB=await r.json(); sset('exdb',EXDB);
  }
  EXDB.forEach(e=>BYID[e.id]=e);
}

/* ---- i18n maps ---- */
const T_MUS={abdominals:'Addominali',abductors:'Abduttori',adductors:'Adduttori',biceps:'Bicipiti',calves:'Polpacci',chest:'Petto',forearms:'Avambracci',glutes:'Glutei',hamstrings:'Femorali',lats:'Dorsali',"lower back":'Lombari',"middle back":'Dorso',neck:'Collo',quadriceps:'Quadricipiti',shoulders:'Spalle',traps:'Trapezi',triceps:'Tricipiti'};
const T_EQ={"body only":'Corpo libero',barbell:'Bilanciere',dumbbell:'Manubri',kettlebells:'Kettlebell',"e-z curl bar":'Bilanciere EZ',cable:'Cavi',machine:'Macchina',bands:'Elastici',"medicine ball":'Palla medica',"exercise ball":'Fitball',"foam roll":'Foam roller',other:'Altro'};
const T_CAT={strength:'Forza',stretching:'Stretching',plyometrics:'Pliometria',powerlifting:'Powerlifting',"olympic weightlifting":'Pesistica',strongman:'Strongman',cardio:'Cardio'};
const T_LV={beginner:'Principiante',intermediate:'Intermedio',expert:'Avanzato'};
const tMus=m=>T_MUS[m]||m, tEq=e=>T_EQ[e]||(e||'—'), tCat=c=>T_CAT[c]||c, tLv=l=>T_LV[l]||l;

/* ---- equipment groups ---- */
const EQGROUP={
  corpo:{label:'Corpo libero',emoji:'🤸',raw:['body only']},
  kb:{label:'Kettlebell',emoji:'🔔',raw:['kettlebells']},
  manubri:{label:'Manubri',emoji:'🏋️',raw:['dumbbell']},
  bilanciere:{label:'Bilanciere + rack',emoji:'🟰',raw:['barbell','e-z curl bar']},
  cavi:{label:'Cavi / macchine',emoji:'⚙️',raw:['cable','machine']},
  altro:{label:'Panca / sbarra / altro',emoji:'🪑',raw:['other','bands','medicine ball','exercise ball','foam roll']}
};
function allowedRaw(keys){const s=new Set();keys.forEach(k=>EQGROUP[k]&&EQGROUP[k].raw.forEach(r=>s.add(r)));return s}

/* ---- goals ---- */
const GOALS={
  forza:{label:'Forza massimale',emoji:'🔥',sets:4,lo:4,hi:6,rest:165,iso:0.2,desc:'Carichi alti, poche ripetizioni'},
  massa:{label:'Massa muscolare',emoji:'💪',sets:4,lo:8,hi:12,rest:90,iso:0.45,desc:'Volume e ipertrofia'},
  dimagrimento:{label:'Dimagrimento e tono',emoji:'⚡',sets:3,lo:12,hi:18,rest:55,iso:0.3,cond:true,desc:'Densità alta, recuperi brevi'},
  resistenza:{label:'Resistenza',emoji:'🏃',sets:3,lo:15,hi:20,rest:45,iso:0.35,cond:true,desc:'Alte ripetizioni, condizionamento'},
  benessere:{label:'Benessere generale',emoji:'🌿',sets:3,lo:10,hi:12,rest:75,iso:0.4,desc:'Equilibrio e mobilità'}
};
const PERSESS={30:4,45:5,60:6,90:8};

/* ---- splits ---- */
const DAYDEF={
  full:[['quadriceps','glutes',1],['chest',1],['lats','middle back',1],['hamstrings','glutes',1],['shoulders',0],['biceps',0,'iso'],['triceps',0,'iso'],['abdominals',0,'iso']],
  push:[['chest',1],['shoulders',1],['chest',0],['triceps',0,'iso'],['shoulders',0,'iso'],['triceps',0,'iso']],
  pull:[['lats','middle back',1],['lats','middle back',1],['traps','middle back',0],['biceps',0,'iso'],['biceps',0,'iso'],['lower back',0]],
  legs:[['quadriceps','glutes',1],['hamstrings','glutes',1],['quadriceps',0],['hamstrings',0,'iso'],['calves',0,'iso'],['abdominals',0,'iso']],
  upper:[['chest',1],['lats','middle back',1],['shoulders',1],['biceps',0,'iso'],['triceps',0,'iso'],['middle back',0],['shoulders',0,'iso'],['chest',0]],
  lower:[['quadriceps','glutes',1],['hamstrings','glutes',1],['quadriceps',0],['calves',0,'iso'],['abdominals',0,'iso'],['hamstrings',0,'iso']]
};
const DAYNAME={full:'Total Body',push:'Spinta (Push)',pull:'Trazione (Pull)',legs:'Gambe',upper:'Upper',lower:'Lower'};
function splitFor(days,goal,style){
  const hard=(goal==='forza'||goal==='massa');
  if(style==='full')return Array(days).fill('full');
  if(days<=2)return ['full','full'].slice(0,days);
  if(days===3)return (hard||style==='split')?['push','pull','legs']:['full','full','full'];
  if(days===4)return ['upper','lower','upper','lower'];
  if(days===5)return ['push','pull','legs','upper','lower'];
  return ['push','pull','legs','push','pull','legs'];
}
function parseSlot(s){
  const muscles=s.filter(x=>typeof x==='string'&&x!=='iso');
  const compound=s.includes(1);
  const iso=s.includes('iso');
  return {muscles,compound,iso}}

/* ---- seeded RNG ---- */
function rng(seed){let a=seed>>>0;return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---- pick one exercise for a slot ---- */
function levelOk(exLv,userLv,caution){
  if(caution&&exLv==='expert')return false;
  if(userLv==='beginner')return exLv!=='expert';
  return true;
}
function catOk(cat,cond){
  if(['strength','powerlifting','olympic weightlifting','strongman'].includes(cat))return true;
  if(cond&&['plyometrics','cardio'].includes(cat))return true;
  return false;
}
function pickExercise(slot,allow,userLv,cond,caution,used,r,prefer){
  const base=EXDB.filter(e=>e.equipment&&allow.has(e.equipment)&&!used.has(e.id)&&catOk(e.category,cond)&&levelOk(e.level,userLv,caution)&&e.primaryMuscles.some(m=>slot.muscles.includes(m)));
  let pool=base;
  if(slot.compound){const c=base.filter(e=>e.mechanic==='compound');if(c.length)pool=c}
  if(slot.iso){const c=base.filter(e=>e.mechanic==='isolation');if(c.length)pool=c}
  if(!pool.length){ // relax: any muscle match in same group ignoring compound
    pool=EXDB.filter(e=>e.equipment&&allow.has(e.equipment)&&!used.has(e.id)&&catOk(e.category,cond)&&e.primaryMuscles.some(m=>slot.muscles.includes(m)));
  }
  // misto: preferisci corpo libero ('body') o sovraccarico ('load'), con fallback se vuoto
  if(prefer&&pool.length){
    const want=prefer==='body'?pool.filter(e=>e.equipment==='body only'):pool.filter(e=>e.equipment!=='body only');
    if(want.length)pool=want;
  }
  if(!pool.length)return null;
  return shuffle(pool,r)[0];
}

/* ---- generate a full program from profile ---- */
function genProgram(p,seedExtra=0){
  const g=GOALS[p.goal], allow=allowedRaw(p.equip), nEx=PERSESS[p.time]||5;
  const split=splitFor(p.days,p.goal,p.style);
  const caution=(p.cautions&&p.cautions.length&&!p.cautions.includes('nessuna'));
  const mix=p.style==='misto'&&p.equip.includes('corpo')&&p.equip.some(k=>k!=='corpo');
  const seed=(p.goal.length*131+p.days*17+p.time+seedExtra*7919)|0;
  const used=new Set();
  const days=split.map((type,di)=>{
    const r=rng(seed+di*104729+seedExtra*1299709);
    const slots=DAYDEF[type].map(parseSlot);
    const exs=[]; const dayUsed=new Set();
    let preferBody=(di%2===0); // misto: alterna corpo libero / sovraccarico, sfasato per giorno
    for(const slot of slots){
      if(exs.length>=nEx)break;
      const prefer=mix?(preferBody?'body':'load'):null;
      // prefer globally-fresh exercises for variety across days
      let ex=pickExercise(slot,allow,p.level,g.cond,caution,new Set([...used,...dayUsed]),r,prefer);
      // fallback: allow exercises used on other days, but never twice in the same day
      if(!ex)ex=pickExercise(slot,allow,p.level,g.cond,caution,dayUsed,r,prefer);
      // ultima spiaggia: ignora la preferenza pur di riempire lo slot
      if(!ex&&mix)ex=pickExercise(slot,allow,p.level,g.cond,caution,dayUsed,r,null);
      if(ex){dayUsed.add(ex.id);used.add(ex.id);preferBody=!preferBody;
        const isIso=slot.iso||ex.mechanic==='isolation';
        exs.push({id:ex.id,sets:isIso?Math.max(3,g.sets-1):g.sets,lo:g.lo,hi:g.hi,rest:isIso?Math.max(45,g.rest-30):g.rest});
      }
    }
    return {key:type,name:DAYNAME[type]+(split.filter(x=>x===type).length>1?' '+String.fromCharCode(65+split.slice(0,di+1).filter(x=>x===type).length-1):''),exercises:exs};
  });
  return {
    id:'p'+Date.now()+seedExtra,
    name:g.label+' · '+p.days+'gg'+(mix?' · misto':''),
    goal:p.goal, mixed:mix, split:split.join('-'), weeks:4,
    days, createdAt:Date.now(), source:'generated', active:false
  };
}

/* ---- progressive-overload helpers ---- */
function epley(w,reps){return Math.round(w*(1+reps/30))}
function lastEntry(exId){
  for(let i=S.history.length-1;i>=0;i--){
    const e=S.history[i].entries.find(x=>x.id===exId&&x.sets.some(s=>s.done));
    if(e)return {sess:S.history[i],entry:e};
  }
  return null;
}
function suggestLoad(exId,hi){
  const le=lastEntry(exId); if(!le)return null;
  const done=le.entry.sets.filter(s=>s.done&&s.weight>0);
  if(!done.length)return null;
  const top=done.reduce((a,b)=>b.weight>a.weight?b:a,done[0]);
  const allHitTop=done.every(s=>s.reps>=hi);
  const isLower=(BYID[exId]&&BYID[exId].primaryMuscles||[]).some(m=>['quadriceps','hamstrings','glutes','calves'].includes(m));
  const inc=isLower?5:2.5;
  return {last:top.weight,suggest:allHitTop?+(top.weight+inc).toFixed(1):top.weight,up:allHitTop,reps:top.reps};
}
function bestE1RM(exId){
  let best=0,date=null;
  S.history.forEach(s=>{const e=s.entries.find(x=>x.id===exId);if(e)e.sets.forEach(st=>{if(st.done&&st.weight>0){const v=epley(st.weight,st.reps||1);if(v>best){best=v;date=s.date}}})});
  return best?{v:best,date}:null;
}

function nextDayIndex(prog){
  // rotate based on history of this program
  const done=S.history.filter(h=>h.programId===prog.id);
  if(!done.length)return 0;
  const last=done[done.length-1];
  const li=prog.days.findIndex(d=>d.name===last.dayName);
  return (li+1)%prog.days.length;
}
function weekCount(){
  if(!S.history.length)return 0;
  const days=new Set(S.history.map(h=>new Date(h.date).toDateString()));
  return days.size;
}
function streak(){
  const set=new Set(S.history.map(h=>new Date(h.date).toDateString()));
  let n=0,d=new Date();
  // count back consecutive days that have a workout, allowing today empty
  if(!set.has(d.toDateString()))d.setDate(d.getDate()-1);
  while(set.has(d.toDateString())){n++;d.setDate(d.getDate()-1)}
  return n;
}

/* ---- AI translation (Claude in Claude) ---- */
async function translateEx(id){
  if(S.trans[id]){const o=document.getElementById('instr');if(o)o.innerHTML=S.trans[id].map(s=>`<li>${esc(s)}</li>`).join('');return}
  const e=BYID[id]; const btn=document.getElementById('trbtn');
  if(btn){btn.disabled=true;btn.textContent='Traduco…'}
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:'Traduci in italiano queste istruzioni di un esercizio di palestra. Rispondi SOLO con un array JSON di stringhe (una per passo), senza altro testo, senza backtick.\n\n'+JSON.stringify(e.instructions)}]})});
    const d=await r.json();
    let txt=(d.content||[]).map(c=>c.text||'').join('').trim().replace(/^```json|```$/g,'').trim();
    const arr=JSON.parse(txt);
    if(Array.isArray(arr)&&arr.length){S.trans[id]=arr;persist('trans');
      const o=document.getElementById('instr');if(o)o.innerHTML=arr.map(s=>`<li>${esc(s)}</li>`).join('');
      if(btn){btn.textContent='🇮🇹 Tradotto';btn.disabled=false}}
    else throw 0;
  }catch(err){if(btn){btn.textContent='🇮🇹 Riprova';btn.disabled=false}toast('Traduzione non riuscita, riprova')}
}

function totalVolume(){return S.history.reduce((a,h)=>a+h.entries.reduce((b,e)=>b+e.sets.filter(s=>s.done).reduce((c,s)=>c+(s.weight||0)*(s.reps||0),0),0),0)}
function exercisesInHistory(){const set=new Set();S.history.forEach(h=>h.entries.forEach(e=>{if(e.sets.some(s=>s.done&&s.weight>0))set.add(e.id)}));return [...set]}
let PROGEX=null;
function lineChart(pts){
  if(pts.length<2)return `<div class="muted" style="font-size:13px;padding:14px 0">Servono almeno 2 sessioni con carico per disegnare il grafico.</div>`;
  const W=460,H=160,pad=24;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const minY=Math.min(...ys),maxY=Math.max(...ys),ry=(maxY-minY)||1;
  const X=i=>pad+i*(W-2*pad)/(pts.length-1);
  const Y=v=>H-pad-(v-minY)/ry*(H-2*pad);
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const area=`M${X(0)} ${H-pad} `+pts.map((p,i)=>`L${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ')+` L${X(pts.length-1)} ${H-pad} Z`;
  return `<svg class="svgchart" viewBox="0 0 ${W} ${H}">
    <defs>
      <linearGradient id="forgeLine" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8B0000"/><stop offset=".55" stop-color="#FF6B00"/><stop offset="1" stop-color="#FFD700"/></linearGradient>
      <linearGradient id="forgeArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6B00" stop-opacity=".24"/><stop offset="1" stop-color="#FF6B00" stop-opacity="0"/></linearGradient>
    </defs>
    <path d="${area}" fill="url(#forgeArea)"/>
    <path d="${d}" fill="none" stroke="url(#forgeLine)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px rgba(255,107,0,.45))"/>
    ${pts.map((p,i)=>{const last=i===pts.length-1;return `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${last?4.5:3}" fill="${last?'#FFD700':'#0a0a0a'}" stroke="${last?'#FFD700':'#FF6B00'}" stroke-width="${last?0:2}"${last?' style="filter:drop-shadow(0 0 8px rgba(255,215,0,.7))"':''}/>`}).join('')}
    <text x="${pad}" y="14" fill="#8a8a90" font-size="11" font-family="Oswald,monospace">${maxY} kg</text>
    <text x="${pad}" y="${H-6}" fill="#8a8a90" font-size="11" font-family="Oswald,monospace">${minY} kg</text>
  </svg>`;
}
function barChart(vals,labels){
  const W=460,H=150,pad=22,n=vals.length,max=Math.max(...vals,1);
  const bw=(W-2*pad)/n*0.62, gap=(W-2*pad)/n;
  return `<svg class="svgchart" viewBox="0 0 ${W} ${H}">
   <defs><linearGradient id="forgeBar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8B0000"/><stop offset=".55" stop-color="#FF6B00"/><stop offset="1" stop-color="#FFD700"/></linearGradient></defs>
   ${vals.map((v,i)=>{const h=(v/max)*(H-2*pad);const x=pad+i*gap+(gap-bw)/2;const y=H-pad-h;const last=i===n-1;
     return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="4" fill="${last?'url(#forgeBar)':'#232326'}"${last?' style="filter:drop-shadow(0 0 10px rgba(255,107,0,.5))"':''}/>
     <text x="${(x+bw/2).toFixed(1)}" y="${H-6}" fill="#6a6a70" font-size="10" text-anchor="middle" font-family="Oswald,monospace">${labels[i]}</text>`}).join('')}
  </svg>`;
}
function weeklyVolume(){
  const weeks=[];const now=new Date();now.setHours(0,0,0,0);
  for(let w=7;w>=0;w--){const start=new Date(now);start.setDate(now.getDate()-now.getDay()+1-w*7);const end=new Date(start);end.setDate(start.getDate()+7);
    const v=S.history.filter(h=>h.date>=start.getTime()&&h.date<end.getTime()).reduce((a,h)=>a+h.entries.reduce((b,e)=>b+e.sets.filter(s=>s.done).reduce((c,s)=>c+(s.weight||0)*(s.reps||0),0),0),0);
    weeks.push({v:Math.round(v/1000),l:(start.getDate())+'/'+(start.getMonth()+1)})}
  return weeks;
}

  if(PROGEX){
    const e=BYID[PROGEX];
    const pts=[];S.history.forEach(h=>{const en=h.entries.find(x=>x.id===PROGEX);if(en){let b=0;en.sets.forEach(s=>{if(s.done&&s.weight>0)b=Math.max(b,epley(s.weight,s.reps||1))});if(b)pts.push({x:h.date,y:b})}});
    html+=`<div class="card" style="margin-top:12px">
      <div class="eyebrow">Progressione forza (1RM stimato)</div>

        ${exH.map(id=>`<option value="${id}" ${id===PROGEX?'selected':''}>${esc(BYID[id]?BYID[id].name:id)}</option>`).join('')}

  // records
  const recs=exH.map(id=>({id,r:bestE1RM(id)})).filter(x=>x.r).sort((a,b)=>b.r.v-a.r.v).slice(0,6);
  if(recs.length){
    html+=`<div class="section-h"><div class="eyebrow">I tuoi record</div></div>`;
    html+=recs.map(x=>`<div class="exrow" style="margin-bottom:8px;cursor:default">
      <div class="thumb">${BYID[x.id]&&BYID[x.id].images?`<img loading="lazy" src="${IMG+BYID[x.id].images[0]}">`:''}</div>
      <div class="meta"><b>${esc(BYID[x.id]?BYID[x.id].name:x.id)}</b><div class="sub"><span>${fmtDate(x.r.date)}</span></div></div>
      <div class="mono" style="font-size:18px;font-weight:700;color:var(--ember-hi)">${x.r.v}<span style="font-size:11px;color:var(--txt3)"> kg</span></div></div>`).join('');
  }
  html+=`<div class="section-h"><div class="eyebrow">Storico (${S.history.length})</div></div>`;
  html+=S.history.slice().reverse().map(histRow).join('');
  return html;
}

        return `<button class="opt ${on?'on':''}" onclick="obPick('${st.key}','${o.v}','${st.type}')">
          ${o.emoji?`<span class="emoji">${o.emoji}</span>`:''}
          <span class="ot"><b>${o.label}</b>${o.sub?`<span>${o.sub}</span>`:''}</span>
          <span class="ck">${svg(I.check)}</span></button>`}).join('')}
      </div>
    </div>
    <div class="ob-foot">
      <button class="btn primary" onclick="obNext()">${OB.step===OB_STEPS.length?'Crea la mia scheda 🔥':'Avanti'}</button>
    </div></div>`;
}
function obBack(){if(OB.step<=1){if(OB.editing){OB.editing=false;render();return}OB.step=0}else OB.step--;renderOnboarding()}
function obPick(key,val,type){
  if(type==='multi'){
    let a=OB.data[key]||[];
    if(key==='cautions'&&val==='nessuna'){a=['nessuna']}
    else if(a.includes(val))a=a.filter(x=>x!==val);
    else{a=a.filter(x=>x!=='nessuna');a.push(val)}
    OB.data[key]=a;
  }else{OB.data[key]=key==='days'||key==='time'?+val:val}
  renderOnboarding();
}
function obNext(){
  const st=OB_STEPS[OB.step-1], v=OB.data[st.key];
  if(st.type==='multi'&&!st.opt&&(!v||!v.length))return toast('Seleziona almeno un\'opzione');
  if(st.type==='single'&&v==null)return toast('Scegli un\'opzione');
  if(OB.step<OB_STEPS.length){OB.step++;renderOnboarding();return}
  // finish
  S.profile={goal:OB.data.goal,level:OB.data.level,equip:OB.data.equip,days:OB.data.days,time:OB.data.time,style:OB.data.style,giornata:OB.data.giornata||'inpiedi',cautions:OB.data.cautions||[],
    h:OB.data.h||186,w:OB.data.w||86,age:OB.data.age||40};
  persist('profile');
  if(OB.editing){OB.editing=false;ov().innerHTML='';TAB='profilo';render();toast('Profilo aggiornato');return}
  // generate first program
  const p=genProgram(S.profile,0);p.active=true;S.programs.push(p);persist('programs');
  ov().innerHTML='';TAB='oggi';render();toast('Scheda creata su misura 🔥','ember');
}

/* ============================ WORKOUT SESSION ============================ */
let SESS_TICK=null;
function startSession(progId,dayIdx){
  let entries=[],dayName='Allenamento libero',pdKey=null;
  if(progId!=null){
    const p=S.programs.find(x=>x.id===progId), d=p.days[dayIdx];
    dayName=d.name;pdKey=d.key;
    entries=d.exercises.map(x=>{
      const sg=suggestLoad(x.id,x.hi);
      const w=sg?sg.suggest:'';
      return {id:x.id,target:{sets:x.sets,lo:x.lo,hi:x.hi,rest:x.rest},
        sets:Array.from({length:x.sets},()=>({reps:'',weight:w,done:false}))};
    });
  }
  SESSION={programId:progId,dayName,startedAt:Date.now(),entries};
  renderSession();
  clearInterval(SESS_TICK);SESS_TICK=setInterval(tickSession,1000);
}
function tickSession(){
  const el=document.getElementById('sess-elapsed');
  if(el&&SESSION){const s=Math.floor((Date.now()-SESSION.startedAt)/1000);el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
  if(REST){REST.remain--;updateRest();if(REST.remain<=0)endRest()}
}
function renderSession(){
  if(!SESSION)return;
  const s=Math.floor((Date.now()-SESSION.startedAt)/1000);
  ov().innerHTML=`<div class="session">
    <div class="sess-head">
      <button class="iconbtn" onclick="cancelSession()">${svg(I.x)}</button>
      <div style="text-align:center"><div style="font-weight:700;font-size:15px">${esc(SESSION.dayName)}</div>
      <div class="sess-timer"><span id="sess-elapsed">${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}</span></div></div>
      <button class="btn sm primary" style="padding:9px 14px" onclick="finishSession()">Fine</button>
    </div>
    <div class="sess-body">
      ${SESSION.entries.map((en,ei)=>sessEx(en,ei)).join('')||'<div class="empty" style="margin-top:30px">Aggiungi un esercizio per iniziare</div>'}
      <button class="btn ghost" style="margin-top:12px" onclick="sessAddExercise()">${svg(I.plus)} Aggiungi esercizio</button>
      <div style="height:60px"></div>
    </div>
  </div>${REST?restBar():''}`;
  bindSessInputs();
}
function sessEx(en,ei){
  const e=BYID[en.id];
  const sg=suggestLoad(en.id,en.target?en.target.hi:12);
  return `<div class="card" style="margin-bottom:12px;padding:14px">
    <div style="display:flex;gap:12px;align-items:center" onclick="openExercise('${en.id}')">
      <div class="thumb" style="width:48px;height:48px;border-radius:10px;flex:none;overflow:hidden;background:var(--surface2)">${e&&e.images?`<img loading="lazy" src="${IMG+e.images[0]}" style="width:100%;height:100%;object-fit:cover">`:''}</div>
      <div style="flex:1;min-width:0"><b style="font-size:15px">${esc(e?e.name:en.id)}</b>
      <div class="prev-hint">${en.target?`obiettivo ${en.target.sets}×${en.target.lo}-${en.target.hi}`:'serie libere'}${sg?` · ${sg.up?'↗ prova '+sg.suggest+'kg':'ultimo '+sg.last+'kg'}`:''}</div></div>
    </div>
    <div class="set-table">
      <div class="set-h"><span>Set</span><span>Kg</span><span>Rip</span><span></span></div>
      ${en.sets.map((s,si)=>`<div class="set-r ${s.done?'done':''}">
        <span class="si">${si+1}</span>
        <input class="setinput" type="number" inputmode="decimal" placeholder="${sg?sg.suggest:'–'}" value="${s.weight}" data-e="${ei}" data-s="${si}" data-f="weight">
        <input class="setinput" type="number" inputmode="numeric" placeholder="${en.target?en.target.lo:'–'}" value="${s.reps}" data-e="${ei}" data-s="${si}" data-f="reps">
        <button class="setck ${s.done?'on':''}" onclick="toggleSet(${ei},${si})">${svg(I.check)}</button>
      </div>`).join('')}
    </div>
    <button class="btn sm ghost" style="margin-top:8px;width:100%" onclick="addSet(${ei})">${svg(I.plus)} Serie</button>
  </div>`;
}
function bindSessInputs(){
  ov().querySelectorAll('.setinput').forEach(inp=>{
    inp.oninput=()=>{const e=+inp.dataset.e,si=+inp.dataset.s,f=inp.dataset.f;SESSION.entries[e].sets[si][f]=inp.value===''?'':+inp.value};
  });
}
function toggleSet(ei,si){
  const st=SESSION.entries[ei].sets[si];st.done=!st.done;
  if(st.done){const en=SESSION.entries[ei];startRest(en.target?en.target.rest:90)}
  renderSession();
}
function addSet(ei){const en=SESSION.entries[ei];const last=en.sets[en.sets.length-1]||{weight:'',reps:''};en.sets.push({weight:last.weight,reps:'',done:false});renderSession()}
function sessAddExercise(){openPicker(id=>{SESSION.entries.push({id,target:null,sets:[{weight:'',reps:'',done:false}]});closeSheet();renderSession()})}
function cancelSession(){
  const any=SESSION.entries.some(e=>e.sets.some(s=>s.done));
  if(!any){SESSION=null;clearInterval(SESS_TICK);REST=null;ov().innerHTML='';render();return}
  confirmSheet('Uscire senza salvare?','I dati di questo allenamento andranno persi.',()=>{SESSION=null;clearInterval(SESS_TICK);REST=null;ov().innerHTML='';render()});
}
function finishSession(){
  const prevRecords={};exercisesInHistory().forEach(id=>{const r=bestE1RM(id);if(r)prevRecords[id]=r.v});
  const entries=SESSION.entries.filter(e=>e.sets.some(s=>s.done));
  if(!entries.length){toast('Completa almeno una serie');return}
  const sess={date:Date.now(),programId:SESSION.programId,dayName:SESSION.dayName,
    entries:entries.map(e=>({id:e.id,sets:e.sets.filter(s=>s.done).map(s=>({weight:+s.weight||0,reps:+s.reps||0,done:true}))}))};
  S.history.push(sess);persist('history');
  // detect new PRs
  let prs=[];sess.entries.forEach(e=>{let b=0;e.sets.forEach(s=>{if(s.weight>0)b=Math.max(b,epley(s.weight,s.reps||1))});if(b&&(!prevRecords[e.id]||b>prevRecords[e.id]))prs.push({id:e.id,v:b})});
  SESSION=null;clearInterval(SESS_TICK);REST=null;
  if(prs.length){showPR(prs)}else{ov().innerHTML='';TAB='progressi';render();toast('Allenamento salvato 💪','ok')}
}
function showPR(prs){
  ov().innerHTML=`<div class="sheet" onclick="if(event.target===this){closeSheet();TAB='progressi';render()}"><div class="sheet-inner"><div class="sheet-grab"></div>
   <div class="detail-body" style="text-align:center">
     <div class="pr-spark" style="font-size:48px;margin:6px 0">🏆</div>
     <div class="eyebrow">Nuovo record!</div><h2 style="margin:6px 0 14px">Hai forgiato ${prs.length} PR</h2>
     ${prs.map(p=>`<div class="exrow" style="margin-bottom:8px;cursor:default"><div class="thumb">${BYID[p.id]&&BYID[p.id].images?`<img src="${IMG+BYID[p.id].images[0]}">`:''}</div>
       <div class="meta"><b>${esc(BYID[p.id]?BYID[p.id].name:p.id)}</b></div>
       <div class="mono" style="font-size:18px;font-weight:700;color:var(--ember-hi)">${p.v} kg</div></div>`).join('')}
     <button class="btn primary" style="margin:16px 0 14px" onclick="closeSheet();TAB='progressi';render()">Continua 🔥</button>
   </div></div></div>`;
}

/* ---- rest timer ---- */
function startRest(sec){REST={remain:sec,total:sec};renderSession()}
function restBar(){
  const r=REST,R=20,C=2*Math.PI*R,off=C*(1-r.remain/r.total),hot=r.remain<=10;
  return `<div class="rest-bar">
    <div class="rest-ring${hot?' hot':''}"><svg width="48" height="48"><defs><linearGradient id="restHeat" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8B0000"/><stop offset=".5" stop-color="#FF6B00"/><stop offset="1" stop-color="#FFD700"/></linearGradient></defs>
      <circle cx="24" cy="24" r="${R}" fill="none" stroke="#232326" stroke-width="4"/>
      <circle id="rest-c" cx="24" cy="24" r="${R}" fill="none" stroke="url(#restHeat)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" style="filter:drop-shadow(0 0 6px rgba(255,107,0,.6))"/></svg>
      <div class="t" id="rest-t">${r.remain}</div></div>
    <div style="flex:1"><div class="stamp" style="font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.06em">Recupero</div><div class="muted" style="font-size:12px">Pronto per la prossima serie</div></div>
    <button class="btn sm" onclick="addRest(15)">+15s</button>
    <button class="btn sm primary" onclick="endRest()">Salta</button>
  </div>`;
}
function updateRest(){
  const t=document.getElementById('rest-t'),c=document.getElementById('rest-c');
  if(t)t.textContent=REST.remain;
  const ring=document.querySelector('.rest-ring');
  if(ring)ring.classList.toggle('hot',REST.remain<=10);
  if(c){const R=20,C=2*Math.PI*R;c.style.strokeDashoffset=(C*(1-REST.remain/REST.total)).toFixed(1)}
}
function addRest(s){if(REST){REST.remain+=s;REST.total+=s;updateRest()}}
function endRest(){REST=null;const b=ov().querySelector('.rest-bar');if(b)b.remove();if('vibrate'in navigator)try{navigator.vibrate(60)}catch(e){}}

/* ============================ CUSTOM BUILDER ============================ */
let CUSTOM=null;
function openCustomBuilder(){CUSTOM={name:'',days:[{name:'Giorno A',exercises:[]}]};renderCustomBuilder()}
function renderCustomBuilder(){
  ov().innerHTML=`<div class="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet-inner"><div class="sheet-grab"></div>
   <div class="detail-body">
     <h2>Scheda personalizzata</h2>
     <label class="fld">Nome scheda</label>
     <input class="inp" placeholder="Es. La mia spinta" value="${esc(CUSTOM.name)}" oninput="CUSTOM.name=this.value">
     ${CUSTOM.days.map((d,di)=>`
       <div class="card" style="margin-top:14px">
         <div style="display:flex;gap:8px;align-items:center">
           <input class="inp" style="flex:1" value="${esc(d.name)}" oninput="CUSTOM.days[${di}].name=this.value">
           ${CUSTOM.days.length>1?`<button class="iconbtn" onclick="cbDelDay(${di})">${svg(I.trash)}</button>`:''}
         </div>
         ${d.exercises.map((x,ei)=>{const e=BYID[x.id];return `
           <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
             <div class="thumb" style="width:42px;height:42px;border-radius:9px;flex:none;overflow:hidden;background:var(--surface2)">${e&&e.images?`<img src="${IMG+e.images[0]}" style="width:100%;height:100%;object-fit:cover">`:''}</div>
             <div style="flex:1;min-width:0"><b style="font-size:13.5px;display:block;line-height:1.2">${esc(e?e.name:x.id)}</b>
             <div style="display:flex;gap:6px;margin-top:5px">
               <input class="setinput" style="padding:6px" type="number" value="${x.sets}" oninput="CUSTOM.days[${di}].exercises[${ei}].sets=+this.value" title="serie">
               <input class="setinput" style="padding:6px" type="number" value="${x.lo}" oninput="CUSTOM.days[${di}].exercises[${ei}].lo=+this.value" title="rip min">
               <input class="setinput" style="padding:6px" type="number" value="${x.hi}" oninput="CUSTOM.days[${di}].exercises[${ei}].hi=+this.value" title="rip max">
             </div></div>
             <button class="iconbtn" onclick="cbDelEx(${di},${ei})">${svg(I.x)}</button>
           </div>`}).join('')}
         <button class="btn sm ghost" style="width:100%;margin-top:10px" onclick="cbAddEx(${di})">${svg(I.plus)} Aggiungi esercizio</button>
       </div>`).join('')}
     <button class="btn ghost" style="margin-top:12px" onclick="cbAddDay()">${svg(I.plus)} Aggiungi giorno</button>
     <button class="btn primary" style="margin-top:12px" onclick="cbSave()">${svg(I.check)} Salva scheda</button>
     <button class="btn ghost" style="margin:9px 0 16px" onclick="closeSheet()">Annulla</button>
   </div></div></div>`;
}
function cbAddDay(){CUSTOM.days.push({name:'Giorno '+String.fromCharCode(65+CUSTOM.days.length),exercises:[]});renderCustomBuilder()}
function cbDelDay(i){CUSTOM.days.splice(i,1);renderCustomBuilder()}
function cbAddEx(di){openPicker(id=>{CUSTOM.days[di].exercises.push({id,sets:3,lo:8,hi:12,rest:90});renderCustomBuilder()})}
function cbDelEx(di,ei){CUSTOM.days[di].exercises.splice(ei,1);renderCustomBuilder()}
function cbSave(){
  if(!CUSTOM.name.trim())return toast('Dai un nome alla scheda');
  if(!CUSTOM.days.some(d=>d.exercises.length))return toast('Aggiungi almeno un esercizio');
  const p={id:'c'+Date.now(),name:CUSTOM.name.trim(),goal:S.profile.goal,split:'custom',weeks:4,
    days:CUSTOM.days.filter(d=>d.exercises.length).map(d=>({key:'custom',name:d.name,exercises:d.exercises.map(x=>({id:x.id,sets:x.sets||3,lo:x.lo||8,hi:x.hi||12,rest:x.rest||90}))})),
    createdAt:Date.now(),source:'custom',active:false};
  S.programs.push(p);persist('programs');CUSTOM=null;closeSheet();render();toast('Scheda salvata ✅','ok');
}

/* ============================ EXERCISE PICKER ============================ */
let PICK={q:'',cb:null};
function openPicker(cb){PICK={q:'',cb};renderPicker()}
function renderPicker(){
  const allow=allowedRaw(S.profile.equip);
  let res=EXDB.filter(e=>e.equipment&&allow.has(e.equipment));
  const q=PICK.q.trim().toLowerCase();
  if(q)res=res.filter(e=>e.name.toLowerCase().includes(q)||(e.primaryMuscles||[]).some(m=>tMus(m).toLowerCase().includes(q)));
  ov().innerHTML=`<div class="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet-inner"><div class="sheet-grab"></div>
   <div class="detail-body">
     <h2 style="margin-bottom:12px">Scegli esercizio</h2>
     <div class="search"><span>${svg(I.search)}</span><input id="pq" placeholder="Cerca…" value="${esc(PICK.q)}"></div>
     <div id="pick-list">${res.slice(0,40).map(e=>`<button class="exrow" style="margin-bottom:8px" data-p="${e.id}">
        <div class="thumb"><img loading="lazy" src="${IMG+e.images[0]}" onerror="this.style.display='none'"></div>
        <div class="meta"><b>${esc(e.name)}</b><div class="sub"><span class="tag ember">${tEq(e.equipment)}</span><span class="tag">${tMus(e.primaryMuscles[0])}</span></div></div>
        ${svg(I.plus)}</button>`).join('')||'<div class="empty">Nessun risultato</div>'}</div>
     <button class="btn ghost" style="margin:8px 0 16px" onclick="closeSheet()">Annulla</button>
   </div></div></div>`;
  const pq=document.getElementById('pq');let t;pq.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{PICK.q=pq.value;renderPicker()},180)};
  ov().querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>PICK.cb&&PICK.cb(b.dataset.p));
}

/* ============================ BOOT ============================ */
async function boot(){
  app().innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;gap:18px">
    <div style="width:72px;height:72px;border-radius:20px;background:var(--grad-ember);display:grid;place-items:center;box-shadow:0 0 40px rgba(255,106,26,.5)">${svg(I.flame,'')}</div>
    <div class="eyebrow">Forgio l'archivio esercizi…</div><div class="spinner"></div></div>`;
  await loadAll();
  try{await loadDB()}catch(e){
    app().innerHTML=`<div class="empty" style="margin-top:80px">${svg(I.x)}<p>Non riesco a scaricare l'archivio esercizi.<br>Controlla la connessione e ricarica.</p><button class="btn primary" style="max-width:200px;margin:16px auto 0" onclick="boot()">Riprova</button></div>`;return;
  }
  render();
}
boot();

</script>

if("serviceWorker" in navigator){
  var _reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(_reloaded)return; _reloaded=true; location.reload();
  });
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(function(reg){
      reg.update();
      setInterval(function(){reg.update()},60*60*1000); // ricontrolla ogni ora
    }).catch(function(){});
  });
}
</script>
