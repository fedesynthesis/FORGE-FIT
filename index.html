<style>
/* ============ FORGED STEEL DESIGN SYSTEM — palette/font Magic Patterns ============ */
:root{
  --bg:#0a0a0a; --bg2:#0f0f10; --surface:#151516; --surface2:#1c1c1e; --surface3:#232326;
  --line:#2e2e32; --line2:#3a3a40;
  --txt:#e7e7e9; --txt2:#8a8a90; --txt3:#6a6a70;
  --ember:#FF6B00; --ember-hi:#FFD700; --ember-deep:#8B0000;
  --steel:#4FA8DC; --ok:#43B85B; --warn:#E3B341; --danger:#F0524A;
  --grad-ember:linear-gradient(100deg,#8B0000 0%,#FF6B00 55%,#FFD700 100%);
  --grad-heat:linear-gradient(90deg,transparent,#FF6B00 35%,#FFD700 50%,#FF6B00 65%,transparent);
  --brush:repeating-linear-gradient(100deg,rgba(255,255,255,.022) 0,rgba(255,255,255,.022) 1px,transparent 1px,transparent 4px);
  --plate-glow:radial-gradient(120% 90% at 12% 0%,rgba(255,107,0,.05) 0,transparent 62%);
  --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --stamp:'Oswald','Arial Narrow',sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --r:14px; --r-s:10px; --r-l:20px;
  --sh:0 6px 24px rgba(0,0,0,.4); --sh-ember:0 0 20px -6px rgba(255,107,0,.55);
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior:none;
  touch-action:pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--txt);
  font-size:16px;line-height:1.45;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* scroller orizzontali interni (chip, tab giorni): consenti solo lì il pan-x */
.chiprow,.daytab{touch-action:pan-x}
#root{max-width:520px;margin:0 auto;min-height:100%;position:relative;background:var(--bg);
  box-shadow:0 0 60px rgba(0,0,0,.5)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:6px}
.mono{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.eyebrow{font-family:var(--stamp);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ember);font-weight:600}
.muted{color:var(--txt2)} .dim{color:var(--txt3)}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700}
a{color:var(--ember)}
::-webkit-scrollbar{width:0;height:0}
/* ---- Magic Patterns helpers: stamp / ember / plate texture ---- */
.stamp{font-family:var(--stamp);letter-spacing:.02em}
.ember-text{background-image:linear-gradient(100deg,#FF6B00,#FFD700);-webkit-background-clip:text;background-clip:text;color:transparent}
.ember-fill{background-image:var(--grad-ember)}
.hatch{background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 1px,transparent 1px,transparent 6px)}
.plate{background-color:var(--surface);background-image:var(--plate-glow),var(--brush);border:1px solid var(--line)}
/* ---- Motion — linguaggio Magic Patterns (ease-forge) ---- */
:root{--ease-forge:cubic-bezier(.23,1,.32,1)}
.btn,.chip,.opt,.iconbtn,.setck,.tag,.daytab button,.nav button,.search{transition:transform .18s var(--ease-forge),background-color .2s var(--ease-forge),border-color .2s var(--ease-forge),color .18s var(--ease-forge),box-shadow .28s var(--ease-forge),filter .25s var(--ease-forge)}
.btn:active{transform:scale(.97)}
.btn.primary:active{filter:brightness(1.08) saturate(1.08)}
.exrow{transition:transform .18s var(--ease-forge),background-color .18s var(--ease-forge),border-color .18s var(--ease-forge)}
.exrow:active{transform:scale(.99)}
.card,.stat,.prog-card,.hero{transition:transform .25s var(--ease-forge),border-color .25s var(--ease-forge),box-shadow .3s var(--ease-forge)}
@media (hover:hover){
  .btn.primary:hover{box-shadow:0 0 30px -6px rgba(255,107,0,.75)}
  .exrow:hover{border-color:var(--line2);transform:translateX(2px)}
  .chip:hover,.opt:hover,.iconbtn:hover,.daytab button:hover{border-color:var(--ember)}
  .card:hover,.stat:hover{border-color:var(--line2)}
}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
main>*{animation:riseIn .5s var(--ease-forge) both}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(5){animation-delay:.2s}main>*:nth-child(6){animation-delay:.25s}
.exrow{animation:riseIn .42s var(--ease-forge) both}
.exrow:nth-child(1){animation-delay:.02s}.exrow:nth-child(2){animation-delay:.06s}.exrow:nth-child(3){animation-delay:.1s}.exrow:nth-child(4){animation-delay:.14s}.exrow:nth-child(5){animation-delay:.18s}.exrow:nth-child(6){animation-delay:.22s}.exrow:nth-child(7){animation-delay:.26s}.exrow:nth-child(8){animation-delay:.3s}
.exrow:nth-child(n+9){animation:none}
.logo{animation:heat 3.2s ease-in-out infinite}
/* transizioni direzionali tra i menu + nav viva */
@keyframes slideFwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
main.nav-fwd{animation:slideFwd .34s var(--ease-forge)}
main.nav-back{animation:slideBack .34s var(--ease-forge)}
@keyframes indIn{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@keyframes navPop{0%{transform:scale(.7);opacity:.3}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}

/* ---------- App chrome ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px calc(14px) 18px;padding-top:max(14px,env(safe-area-inset-top));
  background:linear-gradient(var(--bg) 70%,rgba(16,18,22,.0));backdrop-filter:blur(8px)}
.topbar::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:1px;background:var(--grad-heat);opacity:.5}
.topbar .brand{display:flex;align-items:center;gap:9px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--grad-ember);display:grid;place-items:center;
  box-shadow:0 0 16px rgba(255,106,26,.45);flex:none}
.logo svg{width:18px;height:18px}
.brand b{font-family:var(--stamp);font-weight:700;letter-spacing:.06em;font-size:19px;text-transform:uppercase}
.brand b span{color:var(--ember)}
.iconbtn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--surface);
  border:1px solid var(--line);color:var(--txt2)}
.iconbtn:active{background:var(--surface2)}

main{padding:6px 16px calc(var(--nav-h) + 28px) 16px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:520px;margin:0 auto;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(15,15,16,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--txt3);
  font-size:10.5px;font-weight:600;letter-spacing:.02em;position:relative}
.nav button svg{width:23px;height:23px;stroke-width:1.9}
.nav button.on{color:var(--ember)}
.nav button.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--grad-ember);box-shadow:0 0 10px var(--ember);transform-origin:center;animation:indIn .38s var(--ease-forge)}
.nav button.on svg{animation:navPop .42s var(--ease-forge)}

/* ---------- Cards ---------- */
.card{background-color:var(--surface);background-image:var(--plate-glow),var(--brush);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:12px}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
.section-h .eyebrow{margin-bottom:0}
.section-h h2{margin-top:2px}
.linkbtn{color:var(--ember);font-weight:700;font-size:13px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 18px;border-radius:var(--r);font-weight:700;font-size:15.5px;letter-spacing:.01em;
  background:var(--surface2);color:var(--txt);border:1px solid var(--line2);transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--grad-ember);color:#1a0d04;border:none;box-shadow:0 6px 20px rgba(255,106,26,.32)}
.btn.ghost{background:transparent}
.btn.sm{width:auto;padding:10px 16px;font-size:14px;border-radius:11px}
.btn.danger{color:var(--danger);border-color:rgba(240,82,74,.3);background:rgba(240,82,74,.08)}
.btn svg{width:19px;height:19px}
.btn:disabled{opacity:.5}

/* ---------- Chips ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--txt2);white-space:nowrap;flex:none}
.chip.on{background:rgba(255,106,26,.14);border-color:var(--ember);color:var(--ember-hi)}
.chip:active{transform:scale(.96)}

/* ---------- Pills / tags ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:700;
  letter-spacing:.02em;background:var(--surface2);color:var(--txt2);text-transform:capitalize}
.tag.ember{background:rgba(255,106,26,.13);color:var(--ember-hi)}
.tag.steel{background:rgba(79,168,220,.13);color:var(--steel)}

/* ---------- Exercise list rows ---------- */
.exrow{display:flex;gap:13px;align-items:center;padding:11px;border-radius:var(--r);background:var(--surface);
  border:1px solid var(--line);width:100%;text-align:left}
.exrow:active{background:var(--surface2)}
.exrow .thumb{position:relative;width:62px;height:62px;border-radius:11px;flex:none;background:var(--surface2) center/cover;
  border:1px solid var(--line2);overflow:hidden;display:grid;place-items:center}
.exrow .thumb::before{content:'🏋';font-size:24px;opacity:.3;position:absolute;z-index:0}
.exrow .thumb img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;background:var(--surface2)}
.exrow .meta{flex:1;min-width:0}
.exrow .meta b{font-size:14.5px;font-weight:700;display:block;line-height:1.25}
.exrow .sub{font-size:12px;color:var(--txt2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.fav{flex:none;color:var(--txt3);width:34px;height:34px;display:grid;place-items:center}
.fav.on{color:var(--ember)}

/* ---------- Onboarding ---------- */
.ob{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.ob-head{padding:max(20px,env(safe-area-inset-top)) 22px 8px}
.ob-prog{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:14px}
.ob-prog>div{height:100%;background:var(--grad-ember);border-radius:3px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.ob-body{flex:1;overflow-y:auto;padding:18px 22px 20px}
.ob-body h1{margin-bottom:7px}
.ob-foot{padding:14px 22px max(18px,env(safe-area-inset-bottom));display:flex;gap:12px;border-top:1px solid var(--line)}
.opt{width:100%;text-align:left;padding:16px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);
  margin-top:10px;display:flex;align-items:center;gap:13px;transition:.12s}
.opt:active{transform:scale(.99)}
.opt.on{border-color:var(--ember);background:rgba(255,106,26,.08)}
.opt .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center;transition:.15s}
.opt.on .ck{border-color:var(--ember);background:var(--ember)}
.opt.on .ck svg{opacity:1}
.opt .ck svg{width:13px;height:13px;opacity:0;color:#1a0d04;stroke-width:3.5}
.opt .ot b{font-weight:700;font-size:15.5px;display:block}
.opt .ot span{font-size:12.5px;color:var(--txt2)}
.opt .emoji{font-size:22px;width:30px;text-align:center;flex:none}

/* ---------- Stats ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background-color:var(--surface);background-image:var(--brush);border:1px solid var(--line);border-radius:var(--r);padding:13px 12px}
.stat .v{font-family:var(--stamp);font-size:27px;font-weight:600;letter-spacing:.01em;line-height:1}
.stat .v small{font-size:12px;color:var(--txt2);font-weight:600}
.stat .l{font-size:10.5px;color:var(--txt2);text-transform:uppercase;letter-spacing:.08em;margin-top:6px;font-weight:600}

/* ---------- Today / program card ---------- */
.hero{position:relative;border-radius:var(--r-l);overflow:hidden;padding:20px;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,106,26,.22),transparent 60%),var(--surface);
  border:1px solid var(--line2)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,140,66,.12);pointer-events:none}
.hero .day-ex{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.dayline{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.dayline .n{width:24px;font-family:var(--mono);color:var(--txt3);font-size:13px;flex:none}
.dayline .ln-eq{flex:none;width:20px;text-align:center;font-size:14px;line-height:1}
.dayline b{font-weight:600;font-size:14px;flex:1}
.dayline .s{font-family:var(--mono);font-size:12.5px;color:var(--ember-hi)}

/* ---------- Program (scheda) ---------- */
.prog-card{background-color:var(--surface);background-image:var(--plate-glow),var(--brush);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prog-card.active{border-color:var(--ember)}
.prog-top{padding:15px 16px}
.prog-top .badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.daytab{display:flex;gap:7px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
.daytab button{padding:7px 13px;border-radius:9px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--txt2);white-space:nowrap;flex:none;border:1px solid var(--line)}
.daytab button.on{background:var(--ember);color:#1a0d04;border-color:var(--ember)}

/* ---------- Workout session overlay ---------- */
.session{position:fixed;inset:0;z-index:160;background:var(--bg);max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.sess-head{padding:max(14px,env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--bg2)}
.sess-timer{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ember-hi)}
.sess-body{flex:1;overflow-y:auto;padding:16px 16px 30px}
.set-table{margin-top:12px}
.set-h,.set-r{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center}
.set-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--txt3);font-weight:700;padding:0 2px 7px}
.set-r{padding:5px 0}
.set-r .si{font-family:var(--mono);color:var(--txt2);text-align:center;font-size:14px}
.setinput{width:100%;text-align:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:11px 4px;color:var(--txt);font-family:var(--mono);font-size:16px;font-weight:600}
.setinput:focus{border-color:var(--ember);outline:none}
.set-r.done .setinput{background:rgba(67,184,91,.08);border-color:rgba(67,184,91,.35)}
.setck{width:40px;height:40px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--txt3)}
.setck.on{background:var(--ok);border-color:var(--ok);color:#08210d}
.setck svg{width:19px;height:19px;stroke-width:3}
.prev-hint{font-size:11.5px;color:var(--txt3);font-family:var(--mono);margin-top:2px}

/* ---------- Rest timer ring ---------- */
.rest-bar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:170;
  background:rgba(15,15,16,.96);backdrop-filter:blur(14px);border-top:1px solid var(--ember);box-shadow:var(--sh-ember);
  padding:14px 18px max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;
  animation:slideup .3s ease}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.rest-ring{width:48px;height:48px;flex:none;position:relative}
.rest-ring svg{transform:rotate(-90deg)}
.rest-ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--stamp);font-size:14px;font-weight:600;color:#fff}
.rest-ring.hot .t{color:var(--ember-hi);animation:heat 1.2s ease-in-out infinite}
@keyframes heat{0%,100%{opacity:.7}50%{opacity:1}}

/* ---------- Detail modal ---------- */
.sheet{position:fixed;inset:0;z-index:180;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
.sheet-inner{background:var(--bg2);width:100%;max-width:520px;max-height:92vh;border-radius:var(--r-l) var(--r-l) 0 0;
  overflow-y:auto;border:1px solid var(--line);animation:slideup .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet-grab{width:38px;height:4px;border-radius:3px;background:var(--line2);margin:10px auto 4px}
.detail-img{width:100%;aspect-ratio:1.5/1;object-fit:cover;background:var(--surface2);display:block}
.detail-body{padding:18px}
.instr{counter-reset:s;margin-top:12px;display:flex;flex-direction:column;gap:11px}
.instr li{list-style:none;display:flex;gap:12px;font-size:14px;color:var(--txt);line-height:1.5}
.instr li::before{counter-increment:s;content:counter(s);font-family:var(--mono);font-size:12px;font-weight:700;
  width:24px;height:24px;border-radius:50%;background:var(--surface2);border:1px solid var(--line2);
  display:grid;place-items:center;flex:none;color:var(--ember-hi)}

/* ---------- Misc ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.search input{flex:1;background:none;border:none;color:var(--txt);outline:none}
.search svg{width:19px;height:19px;color:var(--txt3);flex:none}
.empty{text-align:center;padding:46px 20px;color:var(--txt2)}
.empty svg{width:44px;height:44px;color:var(--line2);margin-bottom:14px}
.toast{position:fixed;bottom:calc(var(--nav-h) + 20px);left:50%;transform:translateX(-50%);z-index:300;
  background:var(--surface3);border:1px solid var(--line2);color:var(--txt);padding:12px 18px;border-radius:12px;
  font-size:14px;font-weight:600;box-shadow:var(--sh);max-width:90%;text-align:center;animation:fade .25s}
.toast.ok{border-color:rgba(67,184,91,.4)} .toast.ember{border-color:var(--ember)}
.spinner{width:30px;height:30px;border:3px solid var(--line2);border-top-color:var(--ember);border-radius:50%;animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.divider{height:1px;background:var(--line);margin:14px 0}
label.fld{display:block;font-size:12.5px;color:var(--txt2);font-weight:600;margin:14px 0 6px}
.inp{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:13px 14px;color:var(--txt);outline:none}
.inp:focus{border-color:var(--ember)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pr-spark{animation:spark .6s ease}
@keyframes spark{0%{transform:scale(1)}40%{transform:scale(1.15);filter:drop-shadow(0 0 8px var(--ember))}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.svgchart{width:100%;height:auto;display:block}
.bio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.bio{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em}
.bio>div{display:flex;align-items:baseline;gap:4px;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px}
.bio input{width:100%;min-width:0;background:none;border:none;color:var(--txt);font:600 19px/1 ui-monospace,Menlo,monospace;outline:none}
.bio span{font-size:11px;color:var(--txt3);text-transform:none}
</style>

"compound","level":"intermediate","category":"strength","instructions":["Presa supina (palmi verso di te), mani a larghezza spalle.","Da braccia distese, tira il petto verso la sbarra.","Stringi i dorsali in alto, mento sopra la sbarra.","Scendi lentamente fino a completa distensione."],"images":["Chin-Up/0.jpg","Chin-Up/1.jpg"]},{"id":"cl_squat","name":"Squat a corpo libero","eqgroup":"corpo","equipment":"body only","primaryMuscles":["quadriceps"],"secondaryMuscles":["glutes","hamstrings"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Piedi a larghezza spalle, punte leggermente aperte.","Scendi spingendo i fianchi indietro e in basso, schiena dritta.","Arriva con le cosce parallele al suolo, ginocchia in linea con le punte.","Spingi sui talloni per risalire, contraendo i glutei in alto."],"images":["Bodyweight_Squat/0.jpg","Bodyweight_Squat/1.jpg"]},{"id":"cl_jumpsquat","name":"Squat con salto","eqgroup":"corpo","equipment":"body only","primaryMuscles":["quadriceps"],"secondaryMuscles":["glutes","calves"],"mechanic":"compound","level":"intermediate","category":"plyometrics","instructions":["Parti in posizione di squat, piedi a larghezza spalle.","Scendi in mezzo squat caricando le gambe.","Esplodi verso l'alto saltando il più in alto possibile.","Atterra morbido piegando le ginocchia e incatena la ripetizione."],"images":["Freehand_Jump_Squat/0.jpg","Freehand_Jump_Squat/1.jpg"]},{"id":"cl_bridge","name":"Ponte glutei monopodalico","eqgroup":"corpo","equipment":"body only","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","lower back"],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Sdraiato supino, un piede a terra e l'altra gamba distesa in alto.","Spingi sul tallone a terra sollevando il bacino.","Contrai forte il gluteo in alto, corpo in linea dalla spalla al ginocchio.","Scendi controllando senza appoggiare del tutto. Cambia gamba."],"images":["Single_Leg_Glute_Bridge/0.jpg","Single_Leg_Glute_Bridge/1.jpg"]},{"id":"cl_plank","name":"Plank","eqgroup":"corpo","equipment":"body only","primaryMuscles":["abdominals"],"secondaryMuscles":["lower back","shoulders"],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Appoggia avambracci e punte dei piedi, gomiti sotto le spalle.","Corpo in linea retta: non alzare né far cadere il bacino.","Contrai addome e glutei, sguardo a terra.","Mantieni la posizione respirando in modo regolare per il tempo previsto."],"images":["Plank/0.jpg","Plank/1.jpg"]},{"id":"cl_crunch","name":"Crunch","eqgroup":"corpo","equipment":"body only","primaryMuscles":["abdominals"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Supino, ginocchia piegate, piedi a terra, mani dietro la nuca senza tirare il collo.","Arrotola le spalle verso l'alto staccandole da terra.","Contrai gli addominali nel punto alto.","Scendi lentamente senza appoggiare del tutto la testa."],"images":["Crunches/0.jpg","Crunches/1.jpg"]},{"id":"cl_legraise","name":"Sollevamento gambe alla sbarra","eqgroup":"corpo","equipment":"body only","primaryMuscles":["abdominals"],"secondaryMuscles":["forearms"],"mechanic":"isolation","level":"intermediate","category":"strength","instructions":["Appeso alla sbarra, braccia distese, corpo fermo.","Solleva le gambe distese (o ginocchia) verso l'alto.","Arriva almeno all'altezza dei fianchi controllando l'oscillazione.","Scendi lentamente senza dondolare."],"images":["Hanging_Leg_Raise/0.jpg","Hanging_Leg_Raise/1.jpg"]},{"id":"cl_russian","name":"Russian twist","eqgroup":"corpo","equipment":"body only","primaryMuscles":["abdominals"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Seduto, busto inclinato indietro, gambe sollevate o talloni a terra.","Mani unite davanti al petto.","Ruota il busto portando le mani verso un lato, poi verso l'altro.","Mantieni l'addome contratto per tutto il movimento."],"images":["Russian_Twist/0.jpg","Russian_Twist/1.jpg"]},{"id":"cl_superman","name":"Superman","eqgroup":"corpo","equipment":"body only","primaryMuscles":["lower back"],"secondaryMuscles":["glutes"],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Prono (a pancia in giù), braccia distese in avanti.","Solleva contemporaneamente braccia, petto e gambe da terra.","Contrai lombari e glutei nel punto alto.","Scendi lentamente e ripeti senza slanci."],"images":["Superman/0.jpg","Superman/1.jpg"]},{"id":"cl_situp","name":"Sit-up","eqgroup":"corpo","equipment":"body only","primaryMuscles":["abdominals"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Supino, ginocchia piegate, piedi a terra.","Sali con il busto fino a portarti seduto.","Controlla la discesa srotolando la colonna vertebra per vertebra.","Evita slanci con le braccia."],"images":["3_4_Sit-Up/0.jpg","3_4_Sit-Up/1.jpg"]},{"id":"kb_swing","name":"Slancio kettlebell (swing)","eqgroup":"kb","equipment":"kettlebells","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","lower back","shoulders"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Kettlebell a terra davanti a te, piedi a larghezza spalle.","Cingi il kettlebell e portalo indietro tra le gambe (cerniera d'anca, schiena dritta).","Spingi forte coi fianchi in avanti proiettando il kettlebell fino all'altezza del petto.","La spinta viene dai glutei, non dalle braccia. Riaccompagna tra le gambe e incatena."],"images":["One-Arm_Kettlebell_Swings/0.jpg","One-Arm_Kettlebell_Swings/1.jpg"]},{"id":"kb_goblet","name":"Goblet squat","eqgroup":"kb","equipment":"kettlebells","primaryMuscles":["quadriceps"],"secondaryMuscles":["glutes","hamstrings"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Tieni il kettlebell al petto con entrambe le mani, gomiti in basso.","Piedi a larghezza spalle, scendi in squat tenendo il busto eretto.","Scendi finché i gomiti sfiorano l'interno delle ginocchia.","Spingi sui talloni per risalire."],"images":["Goblet_Squat/0.jpg","Goblet_Squat/1.jpg"]},{"id":"kb_tgu","name":"Turkish get-up","eqgroup":"kb","equipment":"kettlebells","primaryMuscles":["abdominals"],"secondaryMuscles":["shoulders","glutes","quadriceps"],"mechanic":"compound","level":"expert","category":"strength","instructions":["Supino, kettlebell teso verso l'alto con un braccio, occhi sul peso.","Alzati per fasi: sul gomito, sulla mano, ponte, gamba sotto, fino in piedi.","Mantieni sempre il braccio teso e il peso sopra la spalla.","Inverti le fasi per tornare a terra con controllo. Movimento lento."],"images":["Kettlebell_Turkish_Get-Up_Lunge_style/0.jpg","Kettlebell_Turkish_Get-Up_Lunge_style/1.jpg"]},{"id":"kb_clean","name":"Clean kettlebell","eqgroup":"kb","equipment":"kettlebells","primaryMuscles":["shoulders"],"secondaryMuscles":["traps","biceps","glutes"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Kettlebell tra i piedi, cerniera d'anca per impugnarlo.","Tira verso l'alto vicino al corpo e ruota la mano per riceverlo in 'rack' (al petto).","Ammortizza l'arrivo sull'avambraccio, gomito basso.","Riaccompagna in basso e ripeti."],"images":["One-Arm_Kettlebell_Clean/0.jpg","One-Arm_Kettlebell_Clean/1.jpg"]},{"id":"kb_press","name":"Military press kettlebell","eqgroup":"kb","equipment":"kettlebells","primaryMuscles":["shoulders"],"secondaryMuscles":["triceps","traps"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Parti con i kettlebell in posizione rack al petto.","Spingi verso l'alto fino a braccia distese sopra la testa.","Mantieni il core contratto, non inarcare la schiena.","Scendi controllando alla posizione rack."],"images":["Two-Arm_Kettlebell_Military_Press/0.jpg","Two-Arm_Kettlebell_Military_Press/1.jpg"]},{"id":"kb_snatch","name":"Snatch kettlebell","eqgroup":"kb","equipment":"kettlebells","primaryMuscles":["shoulders"],"secondaryMuscles":["glutes","hamstrings","traps"],"mechanic":"compound","level":"expert","category":"strength","instructions":["Come uno swing ma in un solo movimento esplosivo fino sopra la testa.","Spinta d'anca potente, il kettlebell sale vicino al corpo.","Ruota la mano e ricevi il peso a braccio teso in alto, ammortizzando.","Riaccompagna in basso con controllo."],"images":["One-Arm_Kettlebell_Snatch/0.jpg","One-Arm_Kettlebell_Snatch/1.jpg"]},{"id":"kb_row","name":"Rematore kettlebell","eqgroup":"kb","equipment":"kettlebells","primaryMuscles":["middle back"],"secondaryMuscles":["lats","biceps"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Busto inclinato in avanti, schiena dritta, kettlebell in mano.","Tira il kettlebell verso il fianco, gomito stretto al corpo.","Stringi la scapola in alto.","Scendi controllando a braccio teso. Cambia lato."],"images":["One-Arm_Kettlebell_Row/0.jpg","One-Arm_Kettlebell_Row/1.jpg"]},{"id":"kb_dl","name":"Stacco kettlebell monopodalico","eqgroup":"kb","equipment":"kettlebells","primaryMuscles":["hamstrings"],"secondaryMuscles":["glutes","lower back"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["In piedi su una gamba, kettlebell nella mano opposta.","Inclina il busto in avanti facendo cerniera all'anca, gamba libera che va indietro.","Schiena dritta, scendi fino a sentire il femorale in tensione.","Risali contraendo gluteo e femorale."],"images":["Kettlebell_One-Legged_Deadlift/0.jpg","Kettlebell_One-Legged_Deadlift/1.jpg"]},{"id":"kb_windmill","name":"Windmill (mulino)","eqgroup":"kb","equipment":"kettlebells","primaryMuscles":["abdominals"],"secondaryMuscles":["shoulders","glutes"],"mechanic":"compound","level":"expert","category":"strength","instructions":["Kettlebell teso sopra la testa con un braccio, occhi sul peso.","Spingi l'anca lateralmente e inclina il busto, scendendo con la mano libera verso il piede.","Mantieni il braccio con il peso sempre verticale.","Risali contraendo i fianchi."],"images":["Kettlebell_Windmill/0.jpg","Kettlebell_Windmill/1.jpg"]},{"id":"kb_frontsquat","name":"Front squat con kettlebell","eqgroup":"kb","equipment":"kettlebells","primaryMuscles":["quadriceps"],"secondaryMuscles":["glutes","abdominals"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Due kettlebell in posizione rack sulle spalle.","Scendi in squat profondo tenendo il busto eretto e i gomiti alti.","Spingi sui talloni per risalire.","Mantieni il core contratto per tutta l'esecuzione."],"images":["Front_Squats_With_Two_Kettlebells/0.jpg","Front_Squats_With_Two_Kettlebells/1.jpg"]},{"id":"db_bench","name":"Distensioni su panca con manubri","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["chest"],"secondaryMuscles":["triceps","shoulders"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Sdraiato sulla panca, un manubrio per mano all'altezza del petto.","Spingi i manubri verso l'alto fino a braccia quasi distese.","Scendi controllando finché i gomiti sono poco sotto le spalle.","Mantieni i polsi dritti e i piedi ben piantati a terra."],"images":["Dumbbell_Bench_Press/0.jpg","Dumbbell_Bench_Press/1.jpg"]},{"id":"db_incline","name":"Distensioni inclinate con manubri","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["chest"],"secondaryMuscles":["shoulders","triceps"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Panca inclinata a 30-45°, manubri all'altezza del petto alto.","Spingi verso l'alto fino quasi a distendere le braccia.","Scendi controllando, gomiti a circa 45°.","Lavora la parte alta del petto senza arcuare la schiena."],"images":["Hammer_Grip_Incline_DB_Bench_Press/0.jpg","Hammer_Grip_Incline_DB_Bench_Press/1.jpg"]},{"id":"db_fly","name":"Croci con manubri","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["chest"],"secondaryMuscles":["shoulders"],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Supino sulla panca, manubri sopra il petto, braccia leggermente piegate.","Apri le braccia ad arco scendendo lateralmente.","Senti l'allungamento del petto, poi richiudi come per abbracciare.","Mantieni il gomito fisso: il movimento è solo alla spalla."],"images":["Dumbbell_Flyes/0.jpg","Dumbbell_Flyes/1.jpg"]},{"id":"db_row","name":"Rematore con due manubri","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["middle back"],"secondaryMuscles":["lats","biceps"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Busto inclinato in avanti, schiena dritta, un manubrio per mano.","Tira entrambi i manubri verso i fianchi, gomiti stretti.","Stringi le scapole in alto.","Scendi controllando a braccia distese."],"images":["Bent_Over_Two-Dumbbell_Row/0.jpg","Bent_Over_Two-Dumbbell_Row/1.jpg"]},{"id":"db_onerow","name":"Rematore con manubrio (un braccio)","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["middle back"],"secondaryMuscles":["lats","biceps"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Un ginocchio e una mano in appoggio sulla panca, schiena parallela al suolo.","Manubrio nella mano libera, braccio teso.","Tira il manubrio verso il fianco, gomito lungo il corpo.","Stringi la scapola, poi scendi controllando. Cambia lato."],"images":["One-Arm_Dumbbell_Row/0.jpg","One-Arm_Dumbbell_Row/1.jpg"]},{"id":"db_pullover","name":"Pullover con manubrio","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["lats"],"secondaryMuscles":["chest","triceps"],"mechanic":"isolation","level":"intermediate","category":"strength","instructions":["Supino sulla panca, un manubrio tenuto con entrambe le mani sopra il petto.","Porta il manubrio dietro la testa ad arco, braccia poco piegate.","Senti l'allungamento di dorsali e petto.","Riporta sopra il petto contraendo i dorsali."],"images":["Bent-Arm_Dumbbell_Pullover/0.jpg","Bent-Arm_Dumbbell_Pullover/1.jpg"]},{"id":"db_squat","name":"Squat con manubri","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["quadriceps"],"secondaryMuscles":["glutes","hamstrings"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Un manubrio per mano lungo i fianchi, piedi a larghezza spalle.","Scendi in squat spingendo i fianchi indietro, busto eretto.","Cosce parallele al suolo, ginocchia in linea con le punte.","Spingi sui talloni per risalire."],"images":["Dumbbell_Squat/0.jpg","Dumbbell_Squat/1.jpg"]},{"id":"db_lunge","name":"Affondi con manubri","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["quadriceps"],"secondaryMuscles":["glutes","hamstrings"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Manubri lungo i fianchi, in piedi.","Fai un passo avanti e scendi piegando entrambe le ginocchia a 90°.","Il ginocchio posteriore sfiora terra, busto eretto.","Spingi sul tallone anteriore per tornare in piedi. Alterna le gambe."],"images":["Dumbbell_Lunges/0.jpg","Dumbbell_Lunges/1.jpg"]},{"id":"db_stepup","name":"Step-up con manubri","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["quadriceps"],"secondaryMuscles":["glutes","hamstrings"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Manubri ai fianchi, davanti a una panca o rialzo solido.","Sali appoggiando tutto il piede sul rialzo, spingendo col tallone.","Porta su anche l'altra gamba, busto eretto.","Scendi controllando. Alterna la gamba di spinta."],"images":["Dumbbell_Step_Ups/0.jpg","Dumbbell_Step_Ups/1.jpg"]},{"id":"db_rdl","name":"Stacco a gambe tese con manubri","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["hamstrings"],"secondaryMuscles":["glutes","lower back"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Manubri davanti alle cosce, gambe quasi tese (ginocchia morbide).","Inclina il busto in avanti facendo cerniera all'anca, schiena dritta.","Scendi i manubri lungo le gambe fino a sentire i femorali tirare.","Risali contraendo glutei e femorali."],"images":["Stiff-Legged_Dumbbell_Deadlift/0.jpg","Stiff-Legged_Dumbbell_Deadlift/1.jpg"]},{"id":"db_calf","name":"Calf seduto con manubrio","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["calves"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Seduto, avampiede su un rialzo, manubrio appoggiato sul ginocchio.","Abbassa i talloni sentendo l'allungamento del polpaccio.","Spingi sull'avampiede salendo il più in alto possibile.","Contrai il polpaccio in cima, poi scendi lento."],"images":["Dumbbell_Seated_One-Leg_Calf_Raise/0.jpg","Dumbbell_Seated_One-Leg_Calf_Raise/1.jpg"]},{"id":"db_shoulderpress","name":"Lento avanti con manubri","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["shoulders"],"secondaryMuscles":["triceps","traps"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Seduto o in piedi, manubri all'altezza delle spalle, palmi in avanti.","Spingi verso l'alto fino a braccia distese.","Non inarcare la schiena: core contratto.","Scendi controllando all'altezza delle orecchie."],"images":["Dumbbell_Shoulder_Press/0.jpg","Dumbbell_Shoulder_Press/1.jpg"]},{"id":"db_lateral","name":"Alzate laterali","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["shoulders"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["In piedi, manubri ai fianchi, gomiti leggermente piegati.","Solleva le braccia lateralmente fino all'altezza delle spalle.","Guida con i gomiti, non con le mani; non usare slancio.","Scendi lentamente controllando."],"images":["Seated_Side_Lateral_Raise/0.jpg","Seated_Side_Lateral_Raise/1.jpg"]},{"id":"db_front","name":"Alzate frontali","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["shoulders"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["In piedi, manubri davanti alle cosce.","Solleva un braccio (o entrambi) in avanti fino all'altezza delle spalle.","Braccio quasi teso, niente slancio del busto.","Scendi controllando."],"images":["Front_Dumbbell_Raise/0.jpg","Front_Dumbbell_Raise/1.jpg"]},{"id":"db_reardelt","name":"Alzate posteriori","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["shoulders"],"secondaryMuscles":["middle back","traps"],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Busto inclinato in avanti, manubri sotto il petto, braccia poco piegate.","Apri le braccia lateralmente verso l'alto, stringendo le scapole.","Concentra il lavoro sui deltoidi posteriori.","Scendi controllando."],"images":["Reverse_Flyes/0.jpg","Reverse_Flyes/1.jpg"]},{"id":"db_arnold","name":"Arnold press","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["shoulders"],"secondaryMuscles":["triceps"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Seduto, manubri davanti al viso, palmi verso di te.","Mentre spingi verso l'alto, ruota i polsi fino a palmi in avanti.","Distendi le braccia sopra la testa.","Inverti il movimento scendendo, ruotando i palmi verso di te."],"images":["Arnold_Dumbbell_Press/0.jpg","Arnold_Dumbbell_Press/1.jpg"]},{"id":"db_shrug","name":"Scrollate con manubri","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["traps"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["In piedi, manubri lungo i fianchi, braccia tese.","Solleva le spalle verso le orecchie il più in alto possibile.","Stringi i trapezi in alto per un istante.","Scendi controllando senza ruotare le spalle."],"images":["Dumbbell_Shrug/0.jpg","Dumbbell_Shrug/1.jpg"]},{"id":"db_curl","name":"Curl con manubri","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["In piedi, manubri ai fianchi, palmi in avanti.","Fletti i gomiti portando i manubri verso le spalle.","Gomiti fermi lungo il corpo, niente slancio.","Scendi lentamente fino a braccia distese."],"images":["Dumbbell_Bicep_Curl/0.jpg","Dumbbell_Bicep_Curl/1.jpg"]},{"id":"db_hammer","name":"Hammer curl","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["In piedi, manubri ai fianchi con presa neutra (palmi verso il corpo).","Fletti i gomiti mantenendo la presa a martello.","Gomiti fermi, solo l'avambraccio si muove.","Scendi controllando."],"images":["Alternate_Hammer_Curl/0.jpg","Alternate_Hammer_Curl/1.jpg"]},{"id":"db_conc","name":"Curl di concentrazione","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["biceps"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Seduto, gomito appoggiato all'interno coscia, manubrio in mano.","Fletti il gomito portando il manubrio verso la spalla.","Picco di contrazione in alto.","Scendi lentamente a braccio teso. Cambia lato."],"images":["Concentration_Curls/0.jpg","Concentration_Curls/1.jpg"]},{"id":"db_kickback","name":"Kickback tricipiti","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["triceps"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Busto inclinato in avanti, gomito alto e fermo lungo il fianco.","Distendi l'avambraccio all'indietro fino a braccio teso.","Contrai il tricipite in estensione completa.","Riporta in avanti controllando. Solo l'avambraccio si muove."],"images":["Tricep_Dumbbell_Kickback/0.jpg","Tricep_Dumbbell_Kickback/1.jpg"]},{"id":"db_french","name":"French press con manubri","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["triceps"],"secondaryMuscles":[],"mechanic":"isolation","level":"intermediate","category":"strength","instructions":["Supino sulla panca, manubri sopra il petto a braccia tese.","Piega i gomiti portando i manubri verso la fronte/orecchie.","Gomiti fermi e paralleli, non aprirli.","Distendi le braccia contraendo i tricipiti."],"images":["Lying_Dumbbell_Tricep_Extension/0.jpg","Lying_Dumbbell_Tricep_Extension/1.jpg"]},{"id":"db_ohext","name":"Estensione tricipiti sopra la testa","eqgroup":"manubri","equipment":"dumbbell","primaryMuscles":["triceps"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Seduto o in piedi, un manubrio tenuto sopra la testa a braccio teso.","Piega il gomito scendendo il manubrio dietro la nuca.","Gomito fermo e puntato in alto.","Distendi il braccio contraendo il tricipite."],"images":["Dumbbell_One-Arm_Triceps_Extension/0.jpg","Dumbbell_One-Arm_Triceps_Extension/1.jpg"]},{"id":"bb_bench","name":"Panca piana con bilanciere","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["chest"],"secondaryMuscles":["triceps","shoulders"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Supino, presa poco più larga delle spalle, bilanciere sopra il petto.","Stacca dai supporti e porta il bilanciere sopra lo sterno.","Scendi controllando fino a sfiorare il petto, gomiti a ~45°.","Spingi verso l'alto fino a braccia distese. Scapole addotte, piedi a terra."],"images":["Barbell_Bench_Press_-_Medium_Grip/0.jpg","Barbell_Bench_Press_-_Medium_Grip/1.jpg"]},{"id":"bb_incline","name":"Panca inclinata con bilanciere","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["chest"],"secondaryMuscles":["shoulders","triceps"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Panca inclinata 30-45°, presa media sul bilanciere.","Porta il bilanciere sopra il petto alto.","Scendi controllando fino a sfiorare la parte alta del petto.","Spingi verso l'alto distendendo le braccia."],"images":["Barbell_Incline_Bench_Press_-_Medium_Grip/0.jpg","Barbell_Incline_Bench_Press_-_Medium_Grip/1.jpg"]},{"id":"bb_cgbench","name":"Panca presa stretta","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Supino, presa a larghezza spalle (o poco meno).","Scendi il bilanciere verso la parte bassa del petto, gomiti stretti al corpo.","Spingi verso l'alto enfatizzando i tricipiti.","Mantieni i polsi dritti e i gomiti vicini al busto."],"images":["Close-Grip_Barbell_Bench_Press/0.jpg","Close-Grip_Barbell_Bench_Press/1.jpg"]},{"id":"bb_row","name":"Rematore con bilanciere","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["middle back"],"secondaryMuscles":["lats","biceps","lower back"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Busto inclinato ~45°, schiena dritta, presa prona poco più larga delle spalle.","Tira il bilanciere verso l'ombelico/addome basso.","Stringi le scapole, gomiti lungo il corpo.","Scendi controllando a braccia distese senza arrotondare la schiena."],"images":["Bent_Over_Barbell_Row/0.jpg","Bent_Over_Barbell_Row/1.jpg"]},{"id":"bb_deadlift","name":"Stacco da terra","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["lower back"],"secondaryMuscles":["glutes","hamstrings","traps","quadriceps"],"mechanic":"compound","level":"intermediate","category":"powerlifting","instructions":["Bilanciere sopra il metatarso, piedi a larghezza anche, presa fuori dalle ginocchia.","Schiena dritta, petto alto, spalle leggermente avanti alla barra.","Spingi con le gambe e stendi le anche, tenendo la barra vicina al corpo.","In piedi contrai i glutei; scendi facendo cerniera d'anca e piegando le ginocchia."],"images":["Barbell_Deadlift/0.jpg","Barbell_Deadlift/1.jpg"]},{"id":"bb_shrug","name":"Scrollate con bilanciere","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["traps"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["In piedi, bilanciere davanti alle cosce, braccia tese.","Solleva le spalle verso le orecchie il più in alto possibile.","Stringi i trapezi in cima.","Scendi controllando senza ruotare le spalle."],"images":["Barbell_Shrug/0.jpg","Barbell_Shrug/1.jpg"]},{"id":"bb_squat","name":"Squat con bilanciere","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["quadriceps"],"secondaryMuscles":["glutes","hamstrings","lower back"],"mechanic":"compound","level":"intermediate","category":"powerlifting","instructions":["Bilanciere sui trapezi, presa salda, esci dal rack, piedi a larghezza spalle.","Scendi spingendo i fianchi indietro e piegando le ginocchia, busto eretto.","Arriva almeno con le cosce parallele al suolo.","Spingi sui talloni per risalire, ginocchia in linea con le punte."],"images":["Barbell_Squat/0.jpg","Barbell_Squat/1.jpg"]},{"id":"bb_frontsquat","name":"Front squat","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["quadriceps"],"secondaryMuscles":["glutes","abdominals"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Bilanciere in appoggio sui deltoidi anteriori, gomiti alti.","Scendi in squat mantenendo il busto molto eretto.","Cosce parallele al suolo, gomiti sempre alti.","Spingi sui talloni risalendo."],"images":["Front_Barbell_Squat/0.jpg","Front_Barbell_Squat/1.jpg"]},{"id":"bb_rdl","name":"Stacco rumeno","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["hamstrings"],"secondaryMuscles":["glutes","lower back"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["In piedi, bilanciere davanti alle cosce, ginocchia morbide.","Spingi i fianchi indietro scendendo la barra lungo le gambe.","Schiena dritta, scendi fino a sentire i femorali in tensione.","Risali contraendo glutei e femorali, riportando i fianchi avanti."],"images":["Romanian_Deadlift/0.jpg","Romanian_Deadlift/1.jpg"]},{"id":"bb_lunge","name":"Affondi in camminata con bilanciere","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["quadriceps"],"secondaryMuscles":["glutes","hamstrings"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Bilanciere sui trapezi, in piedi.","Fai un passo avanti scendendo in affondo, ginocchio posteriore verso terra.","Spingi sul tallone anteriore avanzando con l'altra gamba.","Procedi camminando, busto eretto e core contratto."],"images":["Barbell_Walking_Lunge/0.jpg","Barbell_Walking_Lunge/1.jpg"]},{"id":"bb_hipthrust","name":"Hip thrust","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Schiena alta appoggiata a una panca, bilanciere sui fianchi (usa un pad).","Piedi a terra a larghezza spalle, ginocchia piegate.","Spingi sui talloni sollevando i fianchi fino a corpo in linea spalle-ginocchia.","Contrai forte i glutei in alto, poi scendi controllando."],"images":["Barbell_Hip_Thrust/0.jpg","Barbell_Hip_Thrust/1.jpg"]},{"id":"bb_goodmorning","name":"Good morning","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["hamstrings"],"secondaryMuscles":["glutes","lower back"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Bilanciere sui trapezi, piedi a larghezza spalle, ginocchia morbide.","Spingi i fianchi indietro inclinando il busto in avanti, schiena dritta.","Scendi fino a busto quasi parallelo al suolo, sentendo i femorali.","Risali contraendo glutei e femorali."],"images":["Good_Morning/0.jpg","Good_Morning/1.jpg"]},{"id":"bb_calf","name":"Calf in piedi con bilanciere","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["calves"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Bilanciere sui trapezi, avampiedi su un rialzo, talloni liberi.","Abbassa i talloni sentendo l'allungamento del polpaccio.","Spingi sull'avampiede salendo il più in alto possibile.","Contrai in cima, poi scendi lento."],"images":["Standing_Barbell_Calf_Raise/0.jpg","Standing_Barbell_Calf_Raise/1.jpg"]},{"id":"bb_ohp","name":"Military press (lento avanti)","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["shoulders"],"secondaryMuscles":["triceps","traps"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["In piedi, bilanciere all'altezza delle clavicole, presa poco più larga delle spalle.","Spingi verso l'alto fino a braccia distese sopra la testa.","Porta leggermente la testa in avanti quando la barra supera il viso.","Core contratto, niente inarcamento. Scendi controllando alle clavicole."],"images":["Standing_Military_Press/0.jpg","Standing_Military_Press/1.jpg"]},{"id":"bb_upright","name":"Tirate al mento","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["shoulders"],"secondaryMuscles":["traps","biceps"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["In piedi, bilanciere davanti alle cosce, presa stretta.","Tira il bilanciere verso il mento guidando con i gomiti alti.","I gomiti restano sempre più alti dei polsi.","Scendi controllando."],"images":["Upright_Barbell_Row/0.jpg","Upright_Barbell_Row/1.jpg"]},{"id":"bb_curl","name":"Curl con bilanciere","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["biceps"],"secondaryMuscles":["forearms"],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["In piedi, bilanciere davanti alle cosce, presa supina a larghezza spalle.","Fletti i gomiti portando la barra verso le spalle.","Gomiti fermi lungo il corpo, niente slancio del busto.","Scendi lentamente fino a braccia distese."],"images":["Barbell_Curl/0.jpg","Barbell_Curl/1.jpg"]},{"id":"bb_skull","name":"Skullcrusher","eqgroup":"bilanciere","equipment":"e-z curl bar","primaryMuscles":["triceps"],"secondaryMuscles":[],"mechanic":"isolation","level":"intermediate","category":"strength","instructions":["Supino, bilanciere EZ sopra il petto a braccia tese.","Piega i gomiti scendendo la barra verso la fronte.","Gomiti fermi e puntati in alto, non aprirli.","Distendi le braccia contraendo i tricipiti."],"images":["EZ-Bar_Skullcrusher/0.jpg","EZ-Bar_Skullcrusher/1.jpg"]},{"id":"bb_lytext","name":"French press con bilanciere","eqgroup":"bilanciere","equipment":"barbell","primaryMuscles":["triceps"],"secondaryMuscles":[],"mechanic":"isolation","level":"intermediate","category":"strength","instructions":["Supino, presa stretta, bilanciere sopra il petto a braccia tese.","Scendi la barra verso la fronte piegando i gomiti.","Gomiti stretti e fermi.","Distendi contraendo i tricipiti."],"images":["Lying_Triceps_Press/0.jpg","Lying_Triceps_Press/1.jpg"]},{"id":"cl_pushwide","name":"Piegamenti presa larga","equipment":"body only","primaryMuscles":["chest"],"secondaryMuscles":["abdominals","shoulders","triceps"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Mani a terra più larghe delle spalle, corpo in linea.","Scendi piegando i gomiti verso l'esterno fino a sfiorare il petto a terra.","Spingi per risalire mantenendo addome e glutei contratti.","La presa larga enfatizza il petto."],"images":["Push-Up_Wide/0.jpg","Push-Up_Wide/1.jpg"]},{"id":"cl_dipspar","name":"Dip alle parallele","equipment":"body only","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Sospeso alle parallele, braccia tese, busto verticale.","Scendi piegando i gomiti fino a circa 90°.","Spingi per risalire fino a braccia distese.","Busto eretto per i tricipiti, leggermente inclinato avanti per il petto."],"images":["Dips_-_Triceps_Version/0.jpg","Dips_-_Triceps_Version/1.jpg"]},{"id":"cl_sideplank","name":"Plank laterale","equipment":"body only","primaryMuscles":["abdominals"],"secondaryMuscles":["shoulders"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Su un fianco, appoggia l'avambraccio a terra sotto la spalla.","Solleva il bacino fino a corpo in linea retta.","Contrai gli obliqui e mantieni la posizione.","Tieni per il tempo previsto, poi cambia lato."],"images":["Side_Bridge/0.jpg","Side_Bridge/1.jpg"]},{"id":"cl_deadbug","name":"Dead bug","equipment":"body only","primaryMuscles":["abdominals"],"secondaryMuscles":[],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Supino, braccia tese verso il soffitto, anche e ginocchia a 90°.","Abbassa lentamente braccio destro e gamba sinistra opposti, senza inarcare la schiena.","Riporta al centro e alterna l'altro lato.","La zona lombare resta sempre aderente al suolo."],"images":["Dead_Bug/0.jpg","Dead_Bug/1.jpg"]},{"id":"cl_obliquecrunch","name":"Crunch obliquo","equipment":"body only","primaryMuscles":["abdominals"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Supino, ginocchia piegate, mani dietro la nuca.","Porta il gomito verso il ginocchio opposto ruotando il busto.","Contrai gli obliqui in alto.","Scendi controllando e alterna i lati."],"images":["Oblique_Crunches/0.jpg","Oblique_Crunches/1.jpg"]},{"id":"cl_reversecrunch","name":"Reverse crunch","equipment":"body only","primaryMuscles":["abdominals"],"secondaryMuscles":[],"mechanic":"isolation","level":"beginner","category":"strength","instructions":["Supino, gambe piegate, ginocchia sopra le anche.","Arrotola il bacino portando le ginocchia verso il petto.","Solleva i glutei da terra con la forza dell'addome basso, senza slancio.","Scendi controllando."],"images":["Reverse_Crunch/0.jpg","Reverse_Crunch/1.jpg"]},{"id":"cl_flutter","name":"Flutter kicks","equipment":"body only","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Supino, gambe distese e leggermente sollevate da terra.","Mani sotto i glutei o lungo i fianchi.","Esegui piccole forbici alternando le gambe su e giù.","Tieni la zona lombare aderente al suolo e l'addome contratto."],"images":["Flutter_Kicks/0.jpg","Flutter_Kicks/1.jpg"]},{"id":"cl_hipraise","name":"Sollevamento bacino","equipment":"body only","primaryMuscles":["abdominals"],"secondaryMuscles":[],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Supino, ginocchia piegate, gambe sollevate.","Arrotola il bacino verso l'alto staccando i glutei da terra.","Contrai l'addome basso in cima.","Scendi lentamente senza dondolare."],"images":["Bent-Knee_Hip_Raise/0.jpg","Bent-Knee_Hip_Raise/1.jpg"]},{"id":"cl_stepknee","name":"Step-up con ginocchio al petto","equipment":"body only","primaryMuscles":["glutes"],"secondaryMuscles":["hamstrings","quadriceps"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Davanti a un rialzo solido, sali appoggiando tutto il piede.","Mentre sali, porta su il ginocchio opposto verso il petto.","Stabilizza in equilibrio per un istante.","Scendi controllando e alterna la gamba."],"images":["Step-up_with_Knee_Raise/0.jpg","Step-up_with_Knee_Raise/1.jpg"]},{"id":"cl_tuckjump","name":"Salto con ginocchia al petto","equipment":"body only","primaryMuscles":["hamstrings"],"secondaryMuscles":["abductors","adductors","calves","glutes","quadriceps"],"mechanic":"compound","level":"beginner","category":"plyometrics","instructions":["In piedi, mezzo squat di caricamento.","Salta in alto portando le ginocchia verso il petto.","Atterra morbido piegando le ginocchia.","Incatena i salti con ritmo controllato."],"images":["Knee_Tuck_Jump/0.jpg","Knee_Tuck_Jump/1.jpg"]},{"id":"cl_starjump","name":"Star jump","equipment":"body only","primaryMuscles":["quadriceps"],"secondaryMuscles":["calves","glutes","hamstrings","shoulders"],"mechanic":"compound","level":"beginner","category":"plyometrics","instructions":["In piedi, gambe unite e braccia lungo i fianchi.","Salta divaricando gambe e braccia a stella.","Atterra morbido richiudendo.","Mantieni un ritmo costante per il condizionamento."],"images":["Star_Jump/0.jpg","Star_Jump/1.jpg"]},{"id":"cl_splitjump","name":"Affondo saltato","equipment":"body only","primaryMuscles":["quadriceps"],"secondaryMuscles":["calves","glutes","hamstrings"],"mechanic":"compound","level":"beginner","category":"plyometrics","instructions":["Parti in posizione di affondo.","Salta in alto e cambia gamba a mezz'aria.","Atterra in affondo con l'altra gamba avanti, ammortizzando.","Mantieni il busto eretto e il core attivo."],"images":["Split_Jump/0.jpg","Split_Jump/1.jpg"]},{"id":"cl_nordic","name":"Leg curl nordico","equipment":"body only","primaryMuscles":["hamstrings"],"secondaryMuscles":["calves","glutes","lower back"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["In ginocchio, caviglie bloccate sotto un appoggio.","Scendi in avanti lentamente resistendo con i femorali, busto rigido.","Arriva il più in basso possibile controllando.","Risali contraendo femorali e glutei (aiutati con le mani se serve)."],"images":["Natural_Glute_Ham_Raise/0.jpg","Natural_Glute_Ham_Raise/1.jpg"]},{"id":"kb_thruster","name":"Thruster kettlebell","equipment":"kettlebells","primaryMuscles":["shoulders"],"secondaryMuscles":["quadriceps","triceps"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Kettlebell in rack sulle spalle, piedi a larghezza spalle.","Scendi in squat profondo tenendo il busto eretto.","Risali esplosivo e, sfruttando la spinta, distendi il peso sopra la testa.","Riporta in rack e incatena il movimento."],"images":["Kettlebell_Thruster/0.jpg","Kettlebell_Thruster/1.jpg"]},{"id":"kb_pushpress","name":"Push press kettlebell","equipment":"kettlebells","primaryMuscles":["shoulders"],"secondaryMuscles":["calves","quadriceps","triceps"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Kettlebell in rack, una mano.","Esegui un breve piegamento delle gambe.","Sfrutta la spinta delle gambe per proiettare il peso sopra la testa.","Distendi il braccio in alto, poi riporta in rack."],"images":["One-Arm_Kettlebell_Push_Press/0.jpg","One-Arm_Kettlebell_Push_Press/1.jpg"]},{"id":"kb_highpull","name":"Sumo high pull","equipment":"kettlebells","primaryMuscles":["traps"],"secondaryMuscles":["adductors","glutes","hamstrings","quadriceps","shoulders"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Posizione sumo, kettlebell a terra tra i piedi.","Cerniera d'anca per impugnarlo, schiena dritta.","Spingi coi fianchi e tira il kettlebell verso il petto, gomiti alti.","Riaccompagna in basso con controllo."],"images":["Kettlebell_Sumo_High_Pull/0.jpg","Kettlebell_Sumo_High_Pull/1.jpg"]},{"id":"kb_fig8","name":"Figure 8 kettlebell","equipment":"kettlebells","primaryMuscles":["abdominals"],"secondaryMuscles":["hamstrings","shoulders"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Piedi larghi, leggero squat, busto inclinato.","Passa il kettlebell tra le gambe disegnando un otto, da una mano all'altra.","Mantieni la schiena dritta e il core contratto.","Movimento fluido e ritmico."],"images":["Kettlebell_Figure_8/0.jpg","Kettlebell_Figure_8/1.jpg"]},{"id":"kb_pistol","name":"Pistol squat con kettlebell","equipment":"kettlebells","primaryMuscles":["quadriceps"],"secondaryMuscles":["calves","glutes","hamstrings","shoulders"],"mechanic":"compound","level":"expert","category":"strength","instructions":["Kettlebell tenuto al petto come contrappeso.","In equilibrio su una gamba, l'altra distesa avanti.","Scendi lentamente in accosciata completa sulla gamba d'appoggio.","Risali spingendo sul tallone. Esercizio avanzato."],"images":["Kettlebell_Pistol_Squat/0.jpg","Kettlebell_Pistol_Squat/1.jpg"]},{"id":"kb_cleanjerk","name":"Clean & jerk kettlebell","equipment":"kettlebells","primaryMuscles":["shoulders"],"secondaryMuscles":[],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Porta il kettlebell in rack con un clean da terra.","Piega leggermente le gambe e spingi (jerk) il peso sopra la testa.","Distendi il braccio bloccando in alto.","Riporta in rack e poi a terra con controllo."],"images":["One-Arm_Kettlebell_Clean_and_Jerk/0.jpg","One-Arm_Kettlebell_Clean_and_Jerk/1.jpg"]},{"id":"db_bss","name":"Bulgarian split squat con manubri","equipment":"dumbbell","primaryMuscles":["quadriceps"],"secondaryMuscles":["glutes","hamstrings"],"mechanic":"compound","level":"beginner","category":"strength","instructions":["Manubri ai fianchi, piede posteriore in appoggio su una panca.","Scendi piegando la gamba anteriore fino a coscia parallela.","Il busto resta eretto, ginocchio in linea col piede.","Spingi sul tallone anteriore per risalire. Cambia gamba."],"images":["Split_Squat_with_Dumbbells/0.jpg","Split_Squat_with_Dumbbells/1.jpg"]},{"id":"db_rearlunge","name":"Affondo all'indietro con manubri","equipment":"dumbbell","primaryMuscles":["quadriceps"],"secondaryMuscles":["calves","glutes","hamstrings"],"mechanic":"compound","level":"intermediate","category":"strength","instructions":["Manubri ai fianchi, in piedi.","Fai un passo indietro scendendo in affondo, ginocchio verso terra.","Busto eretto, peso sulla gamba anteriore.","Spingi per tornare in piedi. Alterna le gambe."],"images":["Dumbbell_Rear_Lunge/0.jpg","Dumbbell_Rear_Lunge/1.jpg"]},{"id":"db_floorpress","name":"Distensioni a terra con manubri","equipment":"dumbbell","primaryMuscles":["triceps"],"secondaryMuscles":["chest","shoulders"],"mechanic":"compound","level":"intermediate","category":"powerlifting","instructions":["Supino a terra, manubri sopra il petto.","Scendi finché i tricipiti toccano il pavimento (gomiti a ~45°).","Fai una breve pausa a terra.","Spingi verso l'a
